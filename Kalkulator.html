<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Noditech AB - Cooling Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#080c18;font-family:'DM Mono',monospace;color:#e2e8f0}
    .app{min-height:100vh;background:radial-gradient(ellipse at 20% 10%,#0f2a4a,#080c18 60%);padding:32px 20px}
    .wrap{max-width:740px;margin:0 auto}
    .card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:22px 26px;margin-bottom:14px}
    .slbl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#64748b;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.1)}
    .field{margin-bottom:16px}
    .field:last-child{margin-bottom:0}
    .lbl{display:flex;justify-content:space-between;font-size:12px;color:#b0bdd0;margin-bottom:6px}
    .utag{font-size:10px;color:#7a8fa8;background:rgba(255,255,255,.07);padding:2px 7px;border-radius:4px}
    input[type=number],input[type=text],select{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:8px;color:#f8fafc;font-family:'DM Mono',monospace;font-size:14px;padding:9px 13px;width:100%;outline:none;-moz-appearance:textfield}
    input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
    input[type=number]:focus,input[type=text]:focus,select:focus{border-color:#38bdf8}
    select option{background:#0f172a}
    input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,.18);outline:none;cursor:pointer;margin-top:7px}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,.2)}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
    .irow{display:flex;flex-wrap:wrap;gap:10px;padding:9px 13px;background:rgba(56,189,248,.09);border:1px solid rgba(56,189,248,.22);border-radius:8px;margin-top:9px}
    .ik{font-size:10px;color:#64748b;margin-right:3px;text-transform:uppercase}
    .iv{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;color:#7dd3fc}
    .iu{font-size:11px;color:#475569}
    .res{background:linear-gradient(135deg,rgba(14,165,233,.13),rgba(56,189,248,.04));border:1px solid rgba(56,189,248,.45);border-radius:16px;padding:24px 26px;margin-bottom:14px}
    .rl2{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#38bdf8;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid rgba(56,189,248,.15)}
    .rg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .ri{background:rgba(0,0,0,.35);border-radius:10px;padding:13px 15px}
    .ri.big{grid-column:1/-1;background:rgba(56,189,248,.14);border:1px solid rgba(56,189,248,.35)}
    .rn{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#7a8fa8;margin-bottom:6px}
    .rv{font-family:'Syne',sans-serif;font-size:24px;font-weight:700;color:#f8fafc;line-height:1}
    .ri.big .rv{font-size:34px;color:#7dd3fc}
    .ru{font-size:11px;color:#64748b;margin-top:3px}
    .fml{font-size:11px;color:#64748b;line-height:1.8;padding:11px 15px;background:rgba(255,255,255,.02);border-left:2px solid rgba(56,189,248,.3);border-radius:0 6px 6px 0;margin-top:13px}
    .fml strong{color:#b0bdd0}
    .warn{font-size:11px;color:#f87171;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.2);border-radius:6px;padding:8px 12px;margin-top:9px}
    .ok{font-size:11px;color:#22c55e;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);border-radius:6px;padding:8px 12px;margin-top:9px}
    .vb{font-family:'Syne',sans-serif;font-size:16px;font-weight:700}
    .bt{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;font-family:'DM Mono',monospace;font-size:12px;border:none;cursor:pointer;transition:all .2s}
    .bt-g{background:rgba(34,197,94,.12);color:#22c55e;border:1px solid rgba(34,197,94,.25)}
    .bt-b{background:rgba(56,189,248,.12);color:#38bdf8;border:1px solid rgba(56,189,248,.25)}
    .bt-y{background:rgba(251,191,36,.12);color:#fbbf24;border:1px solid rgba(251,191,36,.25)}
    .bt-r{background:rgba(248,113,113,.1);color:#f87171;border:1px solid rgba(248,113,113,.2);padding:4px 9px;font-size:11px;border-radius:5px}
    .brow{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
    .bar-t{height:5px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;margin-top:7px}
    .bar-f{height:100%;border-radius:3px;transition:width .5s}
    .bar-l{display:flex;justify-content:space-between;font-size:10px;color:#64748b;margin-top:9px;margin-bottom:4px}
    .pt{width:100%;border-collapse:collapse;font-size:12px}
    .pt th{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#64748b;padding:5px 9px;text-align:left;border-bottom:1px solid rgba(255,255,255,.06)}
    .pt td{padding:8px 9px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:top}
    .pt tr:last-child td{border-bottom:none}
    .pt .re td{color:#b0bdd0}
    .pt .rl td{color:#38bdf8}
    .pt .rd td{color:#7a8fa8}
    .badge{display:inline-block;font-size:9px;border-radius:3px;padding:1px 6px;margin-left:5px}
    .bd{background:rgba(251,191,36,.13);color:#fbbf24}
    .bw{background:rgba(56,189,248,.13);color:#38bdf8}
    .bc{background:rgba(34,197,94,.13);color:#22c55e}
    /* Mode selector */
    .modes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:22px}
    .mbt{padding:13px 6px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.04);color:#64748b;font-family:'DM Mono',monospace;font-size:11px;text-align:center;cursor:pointer;transition:all .2s}
    .mbt.on{border-color:#38bdf8;background:rgba(56,189,248,.12);color:#38bdf8}
    .mbt .mi{font-size:22px;display:block;margin-bottom:5px}
    .mbt .ml{font-family:'Syne',sans-serif;font-weight:700;font-size:12px;display:block;margin-bottom:2px}
    .mbt .ms{font-size:10px;color:#475569;display:block}
    .mbt.on .ms{color:rgba(56,189,248,.7)}
    /* Log */
    .lt{width:100%;border-collapse:collapse;font-size:11px}
    .lt th{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#475569;padding:5px 7px;text-align:left;border-bottom:1px solid rgba(255,255,255,.06);white-space:nowrap}
    .lt td{padding:6px 7px;border-bottom:1px solid rgba(255,255,255,.03);color:#94a3b8}
    .lt tr:last-child td{border-bottom:none}

    .guide-btn{width:100%;padding:10px 14px;border-radius:8px;border:1px solid rgba(56,189,248,.25);background:rgba(56,189,248,.07);color:#7dd3fc;font-family:'DM Mono',monospace;font-size:12px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
    .guide-btn:hover{background:rgba(56,189,248,.12)}
    .guide-btn .arr{transition:transform .2s}
    .guide-btn.open .arr{transform:rotate(180deg)}
    .guide-panel{display:none;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:18px 20px;margin-bottom:14px;background:rgba(255,255,255,.02)}
    .guide-panel.open{display:block}
    .gs{font-size:9px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;padding:4px 10px;border-radius:4px;margin-bottom:10px;display:inline-block}
    .gs-blue{background:rgba(56,189,248,.15);color:#7dd3fc}
    .gs-amber{background:rgba(245,158,11,.15);color:#fcd34d}
    .gs-teal{background:rgba(20,184,166,.15);color:#5eead4}
    .gs-purple{background:rgba(139,92,246,.15);color:#c4b5fd}
    .guide-row{display:grid;grid-template-columns:28px 1fr;gap:10px;margin-bottom:12px;align-items:start}
    .guide-num{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;margin-top:1px}
    .guide-content h4{font-size:11px;font-weight:500;color:#f0f9ff;margin-bottom:3px}
    .guide-content p{font-size:10px;color:#94a3b8;line-height:1.6;margin:0}
    .guide-content ul{font-size:10px;color:#94a3b8;line-height:1.7;margin:3px 0 0 14px;padding:0}
    .gtip{font-size:10px;color:#475569;background:rgba(255,255,255,.03);border-left:2px solid rgba(56,189,248,.3);padding:6px 10px;border-radius:0 5px 5px 0;margin-top:8px;line-height:1.6}
    .gtip strong{color:#94a3b8}
    @media(max-width:520px){.two,.three,.modes,.rg{grid-template-columns:1fr}.ri.big{grid-column:1}.brow{flex-direction:column}}
    @media print{body{background:#fff!important;color:#000!important}.app{background:#fff!important;padding:10px}.card,.res{border:1px solid #ddd!important;background:#fff!important;break-inside:avoid}.rv,.vb,.iv{color:#000!important}.ru,.iu,.ik,.rn,.fml{color:#555!important}.ri{background:#f9f9f9!important}.ri.big{background:#e8f4fd!important}.modes,.brow,.no-print{display:none!important}}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect} = React;

function fmt(n,d=4){if(!isFinite(n)||isNaN(n))return"--";return n.toFixed(d)}
function pSat(T){return 611.21*Math.exp((18.678-T/234.5)*(T/(257.14+T)))}
function humR(T,RH){const pv=(RH/100)*pSat(T);return 0.622*pv/(101325-pv)}
function enth(T,RH){const W=humR(T,RH);return 1.006*T+W*(2501+1.86*T)}
function sVol(T,RH){const pv=(RH/100)*pSat(T);return 287.058*(T+273.15)/(101325-pv)}
function wBulb(T,RH){
  const pv=(RH/100)*pSat(T);let Tw=T-(1-RH/100)*10;
  for(let i=0;i<60;i++){const f=pSat(Tw)-66*(T-Tw)-pv;const df=(pSat(Tw+.001)-pSat(Tw-.001))/.002+66;const d=f/df;Tw-=d;if(Math.abs(d)<.0001)break;}
  return Tw;
}
function eCol(e){if(e>=4)return"#22c55e";if(e>=3)return"#86efac";if(e>=2.5)return"#facc15";return"#f87171"}
function eLbl(e){if(e>=4)return"Excellent";if(e>=3)return"Good";if(e>=2)return"Average";return"Poor"}
function cpGly(p){return 4.18-(4.18-2.38)*(p/100)}
function rhoGly(p){return 1.0+0.0012*p}
const CP=4.186;

function satT(ref,pBar){
  const pAbs=pBar+1.01325,pPa=pAbs*1e5;
  const C={R32:{A:23.2181,B:2525.1,C:-8.34},R290:{A:22.7282,B:2154.7,C:-7.79},R410A:{A:23.1042,B:2564.0,C:-9.21},R22:{A:22.5906,B:2437.0,C:-19.52},R134a:{A:22.59,B:2547.0,C:-22.31},R407C:{A:23.08,B:2600.0,C:-10.0},R404A:{A:22.87,B:2400.0,C:-7.5}};
  const c=C[ref];if(!c)return null;
  return c.B/(c.A-Math.log(pPa))-c.C-273.15;
}
const REFS=['R32','R290','R410A','R22','R134a','R407C','R404A','Other'];
const RCOL={R32:'#a855f7',R290:'#f97316',R410A:'#38bdf8',R22:'#fbbf24',R134a:'#22c55e',R407C:'#f472b6',R404A:'#60a5fa',Other:'#94a3b8'};

function RefSec({unit,refr,setRefr,sP,setSP,dP,setDP,sT,setST}){
  const toC=v=>unit==="F"?(v-32)*5/9:v;
  const sC=unit==="F"?toC(sT):sT;
  const tE=refr!=="Other"?satT(refr,sP):null;
  const tC=refr!=="Other"?satT(refr,dP):null;
  const sh=tE!=null?sC-tE:null;
  const pr=dP>0&&sP>0?(dP+1.01325)/(sP+1.01325):null;
  const rc=RCOL[refr]||'#94a3b8';
  return(
    <div className="card" style={{borderColor:rc+'44'}}>
      <div className="slbl" style={{color:rc}}>Refrigerant - {refr}</div>
      <div className="field">
        <div className="lbl"><span>Refrigerant</span></div>
        <select value={refr} onChange={e=>setRefr(e.target.value)}>{REFS.map(r=><option key={r}>{r}</option>)}</select>
      </div>
      <div className="two">
        <div className="field">
          <div className="lbl"><span>Suction Pressure</span><span className="utag">bar g</span></div>
          <input type="number" min={0} max={60} step={0.0001} value={sP} onChange={e=>setSP(parseFloat(e.target.value)||0)}/>
        </div>
        <div className="field">
          <div className="lbl"><span>Discharge Pressure</span><span className="utag">bar g</span></div>
          <input type="number" min={0} max={120} step={0.0001} value={dP} onChange={e=>setDP(parseFloat(e.target.value)||0)}/>
        </div>
      </div>
      <div className="field">
        <div className="lbl"><span>Suction Gas Temperature</span><span className="utag">deg {unit}</span></div>
        <input type="number" min={-60} max={100} step={0.0001} value={sT} onChange={e=>setST(parseFloat(e.target.value)||0)}/>
      </div>
      {refr!=="Other"&&(
        <div className="three" style={{marginTop:12}}>
          <div style={{background:'rgba(0,0,0,.2)',borderRadius:10,padding:'13px 15px'}}>
            <div className="rn">Evap Temp</div>
            <div className="rv" style={{fontSize:20,color:rc}}>{tE!=null?fmt(tE,4):"--"} C</div>
            <div className="ru">at suction P</div>
          </div>
          <div style={{background:sh!=null&&sh<3?'rgba(248,113,113,.1)':sh!=null&&sh>15?'rgba(251,191,36,.1)':'rgba(34,197,94,.1)',borderRadius:10,padding:'13px 15px',border:sh!=null&&sh<3?'1px solid rgba(248,113,113,.3)':sh!=null&&sh>15?'1px solid rgba(251,191,36,.3)':'1px solid rgba(34,197,94,.2)'}}>
            <div className="rn">Superheat</div>
            <div className="rv" style={{fontSize:20,color:sh!=null&&sh<3?'#f87171':sh!=null&&sh>15?'#fbbf24':'#22c55e'}}>{sh!=null?fmt(sh,4):"--"} K</div>
            <div className="ru">{sh!=null&&sh<3?'Too low!':sh!=null&&sh>15?'Check charge':'Normal'}</div>
          </div>
          <div style={{background:'rgba(0,0,0,.2)',borderRadius:10,padding:'13px 15px'}}>
            <div className="rn">Cond Temp</div>
            <div className="rv" style={{fontSize:20,color:rc}}>{tC!=null?fmt(tC,4):"--"} C</div>
            <div className="ru">at discharge P</div>
          </div>
        </div>
      )}
      {refr!=="Other"&&pr!=null&&(
        <div className="irow" style={{borderColor:rc+'44',background:rc+'11',marginTop:12}}>
          <span><span className="ik">P-ratio</span><span className="iv" style={{color:rc}}>{fmt(pr,4)}</span></span>
          <span><span className="ik">Suction</span><span className="iv" style={{color:rc}}>{fmt(sP,4)}</span><span className="iu"> bar g</span></span>
          <span><span className="ik">Discharge</span><span className="iv" style={{color:rc}}>{fmt(dP,4)}</span><span className="iu"> bar g</span></span>
          {tE!=null&&tC!=null&&<span><span className="ik">dT lift</span><span className="iv" style={{color:rc}}>{fmt(tC-tE,4)}</span><span className="iu"> K</span></span>}
        </div>
      )}
    </div>
  );
}

function AirAir({unit,job,uid,setLog,setShowLog}){
  const [eDB,setEDB]=useState(26);const [eRH,setERH]=useState(50);
  const [lDB,setLDB]=useState(14);const [lRH,setLRH]=useState(90);
  const [oDB,setODB]=useState(35);const [oRH,setORH]=useState(40);
  const [af,setAf]=useState(600);const [pw,setPw]=useState(1.2);
  const [ref,setRef]=useState("R32");const [sP,setSP]=useState(8);const [dP,setDP]=useState(28);const [sT,setST]=useState(15);
  const C=v=>unit==="F"?(v-32)*5/9:v;const F=v=>unit==="F"?v*9/5+32:v;const d=(c,n=1)=>fmt(F(c),n);
  const eC=C(eDB),lC=C(lDB),oC=C(oDB);
  const hE=enth(eC,eRH),vE=sVol(eC,eRH),wE=wBulb(eC,eRH),WE=humR(eC,eRH);
  const hL=enth(lC,lRH),vL=sVol(lC,lRH),wL=wBulb(lC,lRH),WL=humR(lC,lRH);
  const wO=wBulb(oC,oRH),WO=humR(oC,oRH);
  const afs=af/3600,mf=afs/vL,dh=Math.max(0,hE-hL),Q=mf*dh,eer=pw>0?Q/pw:0;
  const dT=eC-lC,sr=dh>0?Math.max(0,Math.min(1,1.006*dT/dh)):0;
  const qs=Q*sr,ql=Q-qs;
  const mn=unit==="F"?23:-5,mx=unit==="F"?113:45,ec=eCol(eer);
  function save(){
    const tE=refr!=="Other"?satT(refr,sP):null;const sC=unit==="F"?C(sT):sT;const sh=tE!=null?sC-tE:null;const tCond=ref!=="Other"?satT(ref,dP):null;
    setLog(p=>[{id:Date.now(),date:new Date().toLocaleString(),mode:'Air/Air',job:job||"--",uid:uid||"--",ref,t1:fmt(F(eC),2),t2:fmt(F(lC),2),wb1:d(wE,2),wb2:d(wL,2),rh1:fmt(eRH,4),rh2:fmt(lRH,4),af,pw:fmt(pw,4),Q:fmt(Q,4),eer:fmt(eer,4),tE:tE!=null?fmt(tE,4):"--",sh:sh!=null?fmt(sh,4):"--",tC:tCond!=null?fmt(tCond,4):"--",sP:fmt(sP,4),dP:fmt(dP,4),unit},...p]);
    setShowLog(true);
  }
  return(<>
    <div className="card">
      <div className="slbl">Inn - Entering Evaporator (Return Air)</div>
      <div className="two">
        <div className="field"><div className="lbl"><span>Dry-Bulb <span className="badge bd">DB</span></span><span className="utag">deg {unit}</span></div>
          <input type="number" min={mn} max={mx} step={0.0001} value={eDB} onChange={e=>setEDB(parseFloat(e.target.value)||0)}/>
          <input type="range" min={mn} max={mx} step={0.1} value={eDB} onChange={e=>setEDB(parseFloat(e.target.value))}/>
        </div>
        <div className="field"><div className="lbl"><span>Relative Humidity</span><span className="utag">%</span></div>
          <input type="number" min={0} max={100} step={0.0001} value={eRH} onChange={e=>setERH(parseFloat(e.target.value)||0)}/>
          <input type="range" min={0} max={100} step={0.0001} value={eRH} onChange={e=>setERH(parseFloat(e.target.value))}/>
        </div>
      </div>
      <div className="irow">
        <span><span className="ik">WBinn</span><span className="iv">{d(wE,2)} deg {unit}</span></span>
        <span><span className="ik">h_inn</span><span className="iv">{fmt(hE)}</span><span className="iu"> kJ/kg</span></span>
        <span><span className="ik">v_inn</span><span className="iv">{fmt(vE,4)}</span><span className="iu"> m3/kg</span></span>
        <span><span className="ik">W_inn</span><span className="iv">{fmt(WE*1000,4)}</span><span className="iu"> g/kg</span></span>
      </div>
    </div>
    <div className="card" style={{borderColor:'rgba(56,189,248,.2)'}}>
      <div className="slbl" style={{color:'#38bdf8'}}>Ut - Leaving Evaporator (Supply Air)</div>
      <div className="two">
        <div className="field"><div className="lbl"><span>Leaving DB <span className="badge bd">DB</span></span><span className="utag">deg {unit} measured</span></div>
          <input type="number" min={mn} max={mx} step={0.0001} value={lDB} onChange={e=>setLDB(parseFloat(e.target.value)||0)} style={{borderColor:'rgba(56,189,248,.4)'}}/>
          <input type="range" min={mn} max={mx} step={0.1} value={lDB} onChange={e=>setLDB(parseFloat(e.target.value))}/>
        </div>
        <div className="field"><div className="lbl"><span>Leaving RH</span><span className="utag">% measured</span></div>
          <input type="number" min={0} max={100} step={0.0001} value={lRH} onChange={e=>setLRH(parseFloat(e.target.value)||0)} style={{borderColor:'rgba(56,189,248,.4)'}}/>
          <input type="range" min={0} max={100} step={0.0001} value={lRH} onChange={e=>setLRH(parseFloat(e.target.value))}/>
        </div>
      </div>
      {lDB>=eDB&&<div className="warn">Leaving DB must be below entering DB</div>}
      <div style={{marginTop:12,padding:'13px 15px',background:'rgba(56,189,248,.07)',border:'1px solid rgba(56,189,248,.18)',borderRadius:8}}>
        <div style={{fontSize:10,letterSpacing:'.15em',textTransform:'uppercase',color:'#38bdf8',marginBottom:9}}>DB + RH - Wet-Bulb Converter</div>

function GuideAA(){
  return(
    <div>
      <button id="guide-aa-btn" className="guide-btn" onClick={()=>toggleGuide('guide-aa')}>
        <span>Measurement Guide - Air / Air &nbsp;<span style={{fontSize:10,opacity:.6}}>accuracy tips for enthalpy calculation</span></span>
        <span className="arr">v</span>
      </button>
      <div id="guide-aa" className="guide-panel">
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
          <div>
            <div className="gs gs-amber">Entering air (Inn)</div>
            <div className="guide-row">
              <div className="guide-num" style={{background:'rgba(245,158,11,.2)',color:'#fcd34d'}}>1</div>
              <div className="guide-content">
                <h4>Dry-Bulb (DB)</h4>
                <p>PT100 or NTC probe, duct center, 30-50 cm from bends. Wait 3-5 min. Take 3 readings and average. Never use IR gun.</p>
              </div>
            </div>
            <div className="guide-row">
              <div className="guide-num" style={{background:'rgba(245,158,11,.2)',color:'#fcd34d'}}>2</div>
              <div className="guide-content">
                <h4>Relative Humidity (RH)</h4>
                <p>Calibrated capacitive hygrometer. Return air 40-60% RH. Wait 3-5 min. Cross-check with sling psychrometer if possible.</p>
              </div>
            </div>
          </div>
          <div>
            <div className="gs gs-teal">Leaving air (Ut)</div>
            <div className="guide-row">
              <div className="guide-num" style={{background:'rgba(20,184,166,.2)',color:'#5eead4'}}>3</div>
              <div className="guide-content">
                <h4>Dry-Bulb (DB)</h4>
                <p>10-20 cm from outlet, center of airstream. Avoid condensate zone below coil. PT100 only. Wait min 5 min.</p>
              </div>
            </div>
            <div className="guide-row">
              <div className="guide-num" style={{background:'rgba(20,184,166,.2)',color:'#5eead4'}}>4</div>
              <div className="guide-content">
                <h4>Relative Humidity (RH)</h4>
                <p>Supply air is 85-95% RH - hardest to measure. Allow 5-10 min stabilisation. Avoid water droplets on sensor. Best: measure WB with sling psychrometer and convert.</p>
              </div>
            </div>
          </div>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,marginTop:10}}>
          <div>
            <div className="gs gs-blue">Airflow</div>
            <div className="guide-row">
              <div className="guide-num" style={{background:'rgba(56,189,248,.2)',color:'#7dd3fc'}}>5</div>
              <div className="guide-content">
                <h4>Volume flow (m3/h)</h4>
                <p>Vane anemometer, min 5 points across grille. Multiply by free area factor (0.65-0.80). Steady-state only - system must run 10-15 min first.</p>
              </div>
            </div>
          </div>
          <div>
            <div className="gs gs-blue">Power</div>
            <div className="guide-row">
              <div className="guide-num" style={{background:'rgba(56,189,248,.2)',color:'#7dd3fc'}}>6</div>
              <div className="guide-content">
                <h4>Compressor power (kW)</h4>
                <p>Clamp meter on live wire. Record kW not kVA. Steady-state only. Inverter units: average over 1 min.</p>
              </div>
            </div>
          </div>
        </div>
        <div className="gtip">Enthalpy accuracy: A 2% RH error at 90% supply RH causes approx 1.5 kJ/kg enthalpy error. With 0.2 kg/s airflow this is 0.3 kW error in Q - roughly 5-10% on a residential unit. Always allow full stabilisation and cross-check RH with wet-bulb measurement where precision matters.</div>
      </div>
    </div>
  );
}

function GuideAL(){
  return(
    <div>
      <button id="guide-al-btn" className="guide-btn" onClick={()=>toggleGuide('guide-al')}>
        <span>Measurement Guide - Air / Liquid &nbsp;<span style={{fontSize:10,opacity:.6}}>water side primary, air side control</span></span>
        <span className="arr">v</span>
      </button>
      <div id="guide-al" className="guide-panel">
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
          <div>
            <div className="gs gs-blue">Liquid side (primary)</div>
            <div className="guide-row">
              <div className="guide-num" style={{background:'rgba(56,189,248,.2)',color:'#7dd3fc'}}>1</div>
              <div className="guide-content">
                <h4>Water temperatures (T inn / T ut)</h4>
                <p>Immersion sensor or insulated clamp-on PT100 directly on pipe. T inn = cold water in, T ut = warmer water out. Avoid elbows and valves.</p>
              </div>
            </div>
            <div className="guide-row">
              <div className="guide-num" style={{background:'rgba(56,189,248,.2)',color:'#7dd3fc'}}>2</div>
              <div className="guide-content">
                <h4>Water flow (L/s)</h4>
                <p>Ultrasonic clamp-on flow meter. Min 10 pipe diameters straight run before sensor. Formula: Q = 4.18 x V(L/s) x dT. 5% flow error = 5% Q error.</p>
              </div>
            </div>
          </div>
          <div>
            <div className="gs gs-amber">Air side (heat rejection control)</div>
            <div className="guide-row">
              <div className="guide-num" style={{background:'rgba(245,158,11,.2)',color:'#fcd34d'}}>3</div>
              <div className="guide-content">
                <h4>Ambient air (Inn) - DB + RH</h4>
                <p>Shade probe from sun. 1 m from condenser inlet, not in discharge stream. Max 60 C. This is the entering ambient air temperature.</p>
              </div>
            </div>
            <div className="guide-row">
              <div className="guide-num" style={{background:'rgba(245,158,11,.2)',color:'#fcd34d'}}>4</div>
              <div className="guide-content">
                <h4>Leaving air (Ut) - DB + RH</h4>
                <p>Leaving air is warmer than ambient - this is heat rejection. Expected: Q_heat = Q_water + P_el. Deviation over 10% indicates measurement error.</p>
              </div>
            </div>
          </div>
        </div>
        <div className="gtip">Balance check: Q_water and Q_air should balance within 5-8%. Larger deviation usually means flow measurement error on water side or airflow error on air side. Trust water side as primary measurement.</div>
      </div>
    </div>
  );
}

function GuideLL(){
  return(
    <div>
      <button id="guide-ll-btn" className="guide-btn" onClick={()=>toggleGuide('guide-ll')}>
        <span>Measurement Guide - Liquid / Liquid &nbsp;<span style={{fontSize:10,opacity:.6}}>both sides measured, balance is key</span></span>
        <span className="arr">v</span>
      </button>
      <div id="guide-ll" className="guide-panel">
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
          <div>
            <div className="gs gs-blue">Cold side (chilled water / glycol)</div>
            <div className="guide-row">
              <div className="guide-num" style={{background:'rgba(56,189,248,.2)',color:'#7dd3fc'}}>1</div>
              <div className="guide-content">
                <h4>T inlet + T outlet</h4>
                <p>Immersion or insulated clamp-on PT100. Measure close to heat exchanger. Even 0.1 C error at 2 C dT = 5% Q error - 4 decimals matters here.</p>
              </div>
            </div>
            <div className="guide-row">
              <div className="guide-num" style={{background:'rgba(56,189,248,.2)',color:'#7dd3fc'}}>2</div>
              <div className="guide-content">
                <h4>Flow (L/s) + glycol %</h4>
                <p>Ultrasonic clamp-on preferred. Use refractometer to verify actual glycol %. Wrong concentration = wrong cp = wrong Q. Calculator adjusts cp and density automatically.</p>
              </div>
            </div>
          </div>
          <div>
            <div className="gs gs-amber">Hot side (condenser water / glycol)</div>
            <div className="guide-row">
              <div className="guide-num" style={{background:'rgba(245,158,11,.2)',color:'#fcd34d'}}>3</div>
              <div className="guide-content">
                <h4>T inlet + T outlet</h4>
                <p>Same method as cold side. Q_hot is always larger than Q_cold by the compressor input power. If Q_hot is less than Q_cold something is wrong.</p>
              </div>
            </div>
            <div className="guide-row">
              <div className="guide-num" style={{background:'rgba(245,158,11,.2)',color:'#fcd34d'}}>4</div>
              <div className="guide-content">
                <h4>Flow (L/s) + glycol %</h4>
                <p>Verify glycol % on hot side separately - concentrations may differ between circuits. Use refractometer.</p>
              </div>
            </div>
          </div>
        </div>
        <div className="gtip">Energy balance: Q_hot = Q_cold + P_el. Deviation over 5-8%: check flow measurements first. Small dT with high flow is much more sensitive to errors than large dT with low flow. At dT = 2 C, a 0.1 C sensor error = 5% Q error.</div>
      </div>
    </div>
  );
}

function App(){

  const [job,setJob]=useState("");const [uid,setUid]=useState("");

  const [showLog,setShowLog]=useState(false);
  useEffect(()=>{localStorage.setItem('ndt_log',JSON.stringify(log))},[log]);
  function delEntry(id){setLog(p=>p.filter(e=>e.id!==id))}

    if(!log.length)return;
    const H=["Date","Mode","Job","Unit","Ref","T1","T2","WB1","WB2","RH1","RH2","Q kW","Qw kW","EER","T_evap","SH K","T_cond","P_suc","P_dis","Temp unit"];

    const csv=[H,...R].map(r=>r.map(c=>'"'+c+'"').join(",")).join("\n");

  return(
    <div className="app">
      <div className="wrap">
        <div style={{marginBottom:28}}>
          <div style={{fontFamily:'Syne,sans-serif',fontSize:'clamp(34px,7vw,66px)',fontWeight:800,color:'#f0f9ff',letterSpacing:'-.03em',lineHeight:1,marginBottom:5}}>
            Nodi<span style={{color:'#38bdf8'}}>tech</span> <span style={{color:'#38bdf8'}}>AB</span>
          </div>
          <div style={{fontFamily:'Syne,sans-serif',fontSize:'clamp(16px,3vw,24px)',fontWeight:700,color:'#94a3b8',marginBottom:3}}>Cooling and EER Calculator</div>

          <div className="modes">
            {[{id:"aa",icon:"A/A",label:"Air / Air",sub:"Luft til luft"},{id:"al",icon:"A/L",label:"Air / Liquid",sub:"Luft til vann"},{id:"ll",icon:"L/L",label:"Liquid / Liquid",sub:"Vann til vann"}].map(m=>(
              <button key={m.id} className={"mbt"+(mode===m.id?" on":"")} onClick={()=>setMode(m.id)}>
                <span className="mi">{m.icon}</span>

        <div className="card no-print">
          <div className="slbl">Measurement Info</div>
          <div className="two">

            <div className="field"><div className="lbl">Unit ID / Serial</div><input type="text" placeholder="e.g. AHU-01" value={uid} onChange={e=>setUid(e.target.value)}/></div>
          </div>
        </div>
        <div className="card no-print">
          <div className="slbl">Temperature Unit</div>
          <div style={{display:'flex',gap:8}}>
            {["C","F"].map(u=><button key={u} onClick={()=>setUnit(u)} style={{flex:1,padding:'9px',borderRadius:8,border:'1px solid',borderColor:unit===u?'#38bdf8':'rgba(255,255,255,.1)',background:unit===u?'rgba(56,189,248,.12)':'rgba(255,255,255,.03)',color:unit===u?'#38bdf8':'#64748b',fontFamily:'DM Mono,monospace',fontSize:13,cursor:'pointer'}}>deg {u}</button>)}
          </div>
        </div>
        {mode==="aa"&&<AirAir unit={unit} job={job} uid={uid} setLog={setLog} setShowLog={setShowLog}/>}
        {mode==="al"&&<AirLiquid unit={unit} job={job} uid={uid} setLog={setLog} setShowLog={setShowLog}/>}
        {mode==="ll"&&<LiqLiq unit={unit} job={job} uid={uid} setLog={setLog} setShowLog={setShowLog}/>}

        <div className="brow no-print" style={{marginTop:8}}>
          <button className="bt bt-y" onClick={()=>setShowLog(v=>!v)}>{showLog?"Hide":"Show"} Log ({log.length})</button>
        </div>
        {showLog&&(
          <div className="card no-print" style={{marginTop:14}}>
            <div className="slbl">Measurement Log</div>
            {log.length===0?<div style={{fontSize:13,color:'#475569',padding:'10px 0'}}>No measurements saved yet.</div>:(
              <>
                <div style={{overflowX:'auto'}}>
                  <table className="lt">
                    <thead><tr><th>Date</th><th>Mode</th><th>Job</th><th>Unit</th><th>Ref</th><th>T1</th><th>T2</th><th>Q kW</th><th>EER</th><th>SH</th><th>T_evap</th><th></th></tr></thead>
                    <tbody>{log.map(e=>(
                      <tr key={e.id}>
                        <td style={{fontSize:10,color:'#64748b',whiteSpace:'nowrap'}}>{e.date}</td>
                        <td style={{fontSize:10}}>{e.mode}</td>

                        <td style={{color:RCOL[e.ref]||'#94a3b8',fontWeight:600}}>{e.ref}</td>

                <div className="brow" style={{marginTop:10}}>
                  <button className="bt bt-b" onClick={exportCSV}>Export CSV</button>
                  <button className="bt-r" style={{padding:'7px 12px',fontSize:11}} onClick={()=>{if(window.confirm("Clear all?"))setLog([])}}>Clear All</button>
                </div>
              </>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

// ── ISEER / SEER / EER Energy Rating Calculator ──────────────────────────
function EnergyRating(){
  // Test point inputs
  // Full load: 35°C outdoor, 27°C indoor DB / 19°C WB
  const [capFull35, setCapFull35] = React.useState(5103);
  const [powFull35, setPowFull35] = React.useState(1224);
  // Half load: 35°C outdoor, 27°C indoor DB / 19°C WB (locked at 50%)
  const [capHalf35, setCapHalf35] = React.useState(2496);
  const [powHalf35, setPowHalf35] = React.useState(483);
  // Interpolation reference: 29°C outdoor, full capacity only
  const [capFull29, setCapFull29] = React.useState(5496);
  const [powFull29, setPowFull29] = React.useState(1119);
  // US B-test: 82°F (27.8°C) outdoor
  const [capB, setCapB] = React.useState(5800);
  const [powB, setPowB] = React.useState(950);
  const [Cd, setCd]     = React.useState(0.25);
  const [open, setOpen] = React.useState(false);

  function fn(n,d=2){if(!isFinite(n)||isNaN(n))return"--";return n.toFixed(d);}
  function stars(n){return "★".repeat(n)+"☆".repeat(5-n);}

  // ── ISEER (India BEE IS 1391 Part 2) ─────────────────────────────────
  // Full load capacity/power: interpolated between 35°C and 29°C test points
  // Half load capacity/power: measured at 35°C, then scaled by same ratio as full load
  const indiaBins=[
    {t:24,h:146},{t:25,h:163},{t:26,h:177},{t:27,h:183},
    {t:28,h:167},{t:29,h:150},{t:30,h:125},{t:31,h:104},
    {t:32,h:86},{t:33,h:67},{t:34,h:54},{t:35,h:46},
    {t:36,h:36},{t:37,h:28},{t:38,h:22},{t:39,h:16},
    {t:40,h:12},{t:41,h:9},{t:42,h:6},{t:43,h:3},
  ];
  const T0=23,Tb=35,Tc=29;
  // Full load interpolated between 35°C and 29°C
  function capFullT(t){return capFull35+(capFull29-capFull35)*(Tb-t)/(Tb-Tc);}
  function powFullT(t){return powFull35+(powFull29-powFull35)*(Tb-t)/(Tb-Tc);}
  // Half load: scale from 35°C measurement using same ratio as full load
  function capHalfT(t){
    const ratio = capFull35>0 ? capHalf35/capFull35 : 0.5;
    return capFullT(t)*ratio;
  }
  function powHalfT(t){
    const ratio = powFull35>0 ? powHalf35/powFull35 : 0.5;
    return powFullT(t)*ratio;
  }
  function coolLoad(t){return (capFull35/1000)*((t-T0)/(Tb-T0));}

  let CSTL=0,CSEC=0;
  indiaBins.forEach(({t,h})=>{
    const load=coolLoad(t);if(load<=0)return;
    const capF=capFullT(t)/1000,capH=capHalfT(t)/1000;
    const powF=powFullT(t)/1000,powH=powHalfT(t)/1000;
    const eerF=powF>0?capF/powF:0,eerH=powH>0?capH/powH:0;
    CSTL+=load*h;
    if(load<=capH){const X=load/capH;const PLF=1-Cd*(1-X);CSEC+=(powH/PLF)*h;}
    else if(load<=capF){const X=(load-capH)/(capF-capH);const p=powH+X*(powF-powH);CSEC+=p*h;}
    else{CSEC+=(capF/eerF)*h;}
  });
  const ISEER=CSEC>0?CSTL/CSEC:0;

  function iseerStars(v){
    if(v>=5.00)return{stars:5,label:"5 Star",color:"#22c55e"};
    if(v>=4.50)return{stars:4,label:"4 Star",color:"#86efac"};
    if(v>=4.00)return{stars:3,label:"3 Star",color:"#facc15"};
    if(v>=3.50)return{stars:2,label:"2 Star",color:"#fb923c"};
    return{stars:1,label:"1 Star",color:"#f87171"};
  }
  const indiaRating=iseerStars(ISEER);

  // ── EU SEER (EN 14825 / ErP 2016/2281) ───────────────────────────────
  // Indoor: 27°C DB / 19°C WB  Outdoor: 35/30/25/20°C
  // Full load at 35°C, interpolated using 29°C reference
  const euBins=[{t:20,h:205},{t:25,h:227},{t:30,h:225},{t:35,h:270}];
  function capEU(t){return capFull35+(capFull29-capFull35)*(35-t)/(35-29);}
  function powEU(t){return powFull35+(powFull29-powFull35)*(35-t)/(35-29);}
  const Pref=capFull35/1000;
  let CSTL_EU=0,CSEC_EU=0;
  euBins.forEach(({t,h})=>{
    const pl=Math.max(0,(t-16)/(35-16));
    const load=Pref*pl;if(load<=0)return;
    const cap=Math.min(capEU(t)/1000,Pref);
    const pow=powEU(t)/1000;
    const eer=pow>0?cap/pow:0;
    CSTL_EU+=load*h;
    if(load<=cap){const X=load/cap;const PLF=1-Cd*(1-X);CSEC_EU+=(load/eer/PLF)*h;}
    else{CSEC_EU+=(cap/eer)*h;}
  });
  const SEER_EU=CSEC_EU>0?CSTL_EU/CSEC_EU:0;

  function euClass(v){
    if(v>=8.5)return{cls:"A+++",color:"#166534",bg:"#bbf7d0"};
    if(v>=6.1)return{cls:"A++", color:"#15803d",bg:"#dcfce7"};
    if(v>=5.6)return{cls:"A+",  color:"#16a34a",bg:"#f0fdf4"};
    if(v>=5.1)return{cls:"A",   color:"#65a30d",bg:"#f7fee7"};
    if(v>=4.6)return{cls:"B",   color:"#ca8a04",bg:"#fefce8"};
    if(v>=4.1)return{cls:"C",   color:"#d97706",bg:"#fffbeb"};
    if(v>=3.6)return{cls:"D",   color:"#ea580c",bg:"#fff7ed"};
    return{cls:"E",color:"#dc2626",bg:"#fef2f2"};
  }
  const euRating=euClass(SEER_EU);

  // ── US SEER2 (AHRI 210/240-2023) ─────────────────────────────────────
  // Indoor: 80°F (26.7°C) DB / 67°F (19.4°C) WB
  const indoorCorr=0.997;
  const capA=capFull35*indoorCorr,powA=powFull35*indoorCorr;
  const usBins=[
    {t:67,h:214},{t:72,h:231},{t:77,h:243},{t:82,h:253},
    {t:87,h:234},{t:92,h:189},{t:97,h:128},{t:102,h:63},{t:107,h:12},
  ];
  function capUS_W(f){return capA+(capB-capA)*(95-f)/(95-82);}
  function powUS_W(f){return powA+(powB-powA)*(95-f)/(95-82);}
  const refCapUS=capA/1000;
  let CSTL_US=0,CSEC_US=0;
  usBins.forEach(({t,h})=>{
    const pl=Math.max(0,(t-65)/(95-65));
    const load=refCapUS*pl;if(load<=0)return;
    const cap=Math.min(capUS_W(t)/1000,refCapUS);
    const pow=powUS_W(t)/1000;
    const eer=pow>0?cap/pow:0;
    CSTL_US+=load*h;
    if(load<=cap){const X=load/cap;const PLF=1-Cd*(1-X);CSEC_US+=(load/eer/PLF)*h;}
    else{CSEC_US+=(cap/eer)*h;}
  });
  const SEER_US=CSEC_US>0?(CSTL_US/CSEC_US)*3.412:0;
  const EER_US=(capA/powA)*3.412;

  function usClass(v){
    if(v>=22)return{cls:"Energy Star",detail:"Top tier",    color:"#15803d",bg:"#dcfce7"};
    if(v>=18)return{cls:"High Eff.",  detail:"Above std",   color:"#65a30d",bg:"#f7fee7"};
    if(v>=15)return{cls:"Standard",   detail:"Meets min",   color:"#ca8a04",bg:"#fefce8"};
    if(v>=14)return{cls:"Marginal",   detail:"Near min",    color:"#ea580c",bg:"#fff7ed"};
    return{cls:"Below Min",detail:"Fails DOE min",color:"#dc2626",bg:"#fef2f2"};
  }
  const usRating=usClass(SEER_US);

  return(
    <div className="card" style={{borderColor:'rgba(56,189,248,.2)',marginTop:14}}>
      <button className="guide-btn" onClick={()=>setOpen(v=>!v)} style={{marginBottom:open?14:0}}>
        <span>Energy Rating Calculator &nbsp;
          <span style={{fontSize:10,opacity:.6}}>ISEER (India) · SEER (EU ErP) · SEER2 (US DOE/AHRI)</span>
        </span>
        <span style={{transition:'transform .2s',transform:open?'rotate(180deg)':'none'}}>&#9660;</span>
      </button>
      {open&&(
        <div>
          {/* Test condition badges */}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:14}}>
            <div style={{background:'rgba(245,158,11,.07)',border:'1px solid rgba(245,158,11,.2)',borderRadius:8,padding:'8px 10px',fontSize:9,color:'#fbbf24',lineHeight:1.6}}>
              <strong>ISEER (India IS 1391)</strong><br/>
              Full load: 35°C out / 27°C in<br/>
              Half load: 35°C out / 27°C in<br/>
              Curve ref: 29°C out (full only)
            </div>
            <div style={{background:'rgba(56,189,248,.07)',border:'1px solid rgba(56,189,248,.2)',borderRadius:8,padding:'8px 10px',fontSize:9,color:'#7dd3fc',lineHeight:1.6}}>
              <strong>EU EN 14825 / ErP</strong><br/>
              Full load: 35°C out / 27°C in<br/>
              Part load: 30/25/20°C out<br/>
              Curve ref: 29°C out
            </div>
            <div style={{background:'rgba(139,92,246,.07)',border:'1px solid rgba(139,92,246,.2)',borderRadius:8,padding:'8px 10px',fontSize:9,color:'#c4b5fd',lineHeight:1.6}}>
              <strong>US AHRI 210/240</strong><br/>
              A-test: 95°F out / 80°F in<br/>
              B-test: 82°F out / 80°F in<br/>
              Indoor = 26.7°C (not 27°C)
            </div>
          </div>

          {/* Inputs */}
          <div className="slbl">Test Point Data</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:14,marginBottom:14}}>
            <div>
              <div style={{fontSize:9,color:'#fbbf24',letterSpacing:'.1em',textTransform:'uppercase',marginBottom:8}}>35°C outdoor — full load</div>
              <div className="field"><div className="lbl"><span>Capacity</span><span className="utag">W</span></div>
                <input type="number" step={1} value={capFull35} onChange={e=>setCapFull35(parseFloat(e.target.value)||0)}/></div>
              <div className="field"><div className="lbl"><span>Power</span><span className="utag">W</span></div>
                <input type="number" step={1} value={powFull35} onChange={e=>setPowFull35(parseFloat(e.target.value)||0)}/></div>
              <div style={{marginTop:10,fontSize:9,color:'#fbbf24',letterSpacing:'.1em',textTransform:'uppercase',marginBottom:8}}>35°C outdoor — half load</div>
              <div className="field"><div className="lbl"><span>Capacity (locked 50%)</span><span className="utag">W</span></div>
                <input type="number" step={1} value={capHalf35} onChange={e=>setCapHalf35(parseFloat(e.target.value)||0)}/></div>
              <div className="field"><div className="lbl"><span>Power (locked 50%)</span><span className="utag">W</span></div>
                <input type="number" step={1} value={powHalf35} onChange={e=>setPowHalf35(parseFloat(e.target.value)||0)}/></div>
            </div>
            <div>
              <div style={{fontSize:9,color:'#38bdf8',letterSpacing:'.1em',textTransform:'uppercase',marginBottom:8}}>29°C outdoor — curve reference</div>
              <div style={{fontSize:9,color:'#64748b',marginBottom:8,lineHeight:1.5}}>Full load only. Used to build capacity curve across bins. Half load scaled proportionally.</div>
              <div className="field"><div className="lbl"><span>Capacity full load</span><span className="utag">W</span></div>
                <input type="number" step={1} value={capFull29} onChange={e=>setCapFull29(parseFloat(e.target.value)||0)}/></div>
              <div className="field"><div className="lbl"><span>Power full load</span><span className="utag">W</span></div>
                <input type="number" step={1} value={powFull29} onChange={e=>setPowFull29(parseFloat(e.target.value)||0)}/></div>
              <div className="field" style={{marginTop:8}}><div className="lbl"><span>Degradation coeff. Cd</span><span className="utag">0–1</span></div>
                <input type="number" min={0} max={1} step={0.01} value={Cd} onChange={e=>setCd(parseFloat(e.target.value)||0)}/></div>
            </div>
            <div>
              <div style={{fontSize:9,color:'#c4b5fd',letterSpacing:'.1em',textTransform:'uppercase',marginBottom:8}}>82°F / 27.8°C outdoor — US B-test</div>
              <div style={{fontSize:9,color:'#64748b',marginBottom:8,lineHeight:1.5}}>Full load at 82°F. Indoor = 80°F (26.7°C). Used only for US SEER2 calculation.</div>
              <div className="field"><div className="lbl"><span>Capacity full load</span><span className="utag">W</span></div>
                <input type="number" step={1} value={capB} onChange={e=>setCapB(parseFloat(e.target.value)||0)}/></div>
              <div className="field"><div className="lbl"><span>Power full load</span><span className="utag">W</span></div>
                <input type="number" step={1} value={powB} onChange={e=>setPowB(parseFloat(e.target.value)||0)}/></div>
              <div style={{fontSize:9,color:'#64748b',marginTop:6,lineHeight:1.5}}>Indoor corr. factor: x{indoorCorr}<br/>(26.7°C vs 27°C)</div>
            </div>
          </div>

          {/* Results */}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12}}>
            <div style={{background:'rgba(0,0,0,.25)',borderRadius:12,padding:'16px 14px',border:'1px solid rgba(245,158,11,.25)'}}>
              <div style={{fontSize:9,letterSpacing:'.15em',textTransform:'uppercase',color:'#fbbf24',marginBottom:10}}>India BEE</div>
              <div style={{fontFamily:'Syne,sans-serif',fontSize:32,fontWeight:800,color:indiaRating.color,lineHeight:1}}>{fn(ISEER,2)}</div>
              <div style={{fontSize:10,color:'#64748b',marginTop:2,marginBottom:10}}>ISEER</div>
              <div style={{background:'rgba(0,0,0,.3)',borderRadius:8,padding:'8px 10px',textAlign:'center'}}>
                <div style={{fontSize:18,color:indiaRating.color}}>{stars(indiaRating.stars)}</div>
                <div style={{fontFamily:'Syne,sans-serif',fontSize:13,fontWeight:700,color:indiaRating.color,marginTop:2}}>{indiaRating.label}</div>
              </div>
              <div style={{marginTop:10,fontSize:9,color:'#475569',lineHeight:1.7}}>
                <div>CSTL: {fn(CSTL/1000,1)} kWh/yr</div>
                <div>CSEC: {fn(CSEC,1)} kWh/yr</div>
                <div style={{marginTop:4,color:'#64748b'}}>IS 1391 Part 2 · 20 bins</div>
                <div style={{color:'#64748b'}}>24–43°C · Indoor 27°C</div>
              </div>
            </div>
            <div style={{background:'rgba(0,0,0,.25)',borderRadius:12,padding:'16px 14px',border:'1px solid rgba(56,189,248,.25)'}}>
              <div style={{fontSize:9,letterSpacing:'.15em',textTransform:'uppercase',color:'#38bdf8',marginBottom:10}}>EU ErP / EN 14825</div>
              <div style={{fontFamily:'Syne,sans-serif',fontSize:32,fontWeight:800,color:'#38bdf8',lineHeight:1}}>{fn(SEER_EU,2)}</div>
              <div style={{fontSize:10,color:'#64748b',marginTop:2,marginBottom:10}}>SEER</div>
              <div style={{background:euRating.bg,borderRadius:8,padding:'8px 10px',textAlign:'center',border:'2px solid '+euRating.color}}>
                <div style={{fontFamily:'Syne,sans-serif',fontSize:22,fontWeight:800,color:euRating.color}}>{euRating.cls}</div>
                <div style={{fontSize:10,color:euRating.color,marginTop:2}}>EU Energy Label</div>
              </div>
              <div style={{marginTop:10,fontSize:9,color:'#475569',lineHeight:1.7}}>
                <div>A+++ &gt;8.5 · A++ &gt;6.1</div>
                <div>A+ &gt;5.6 · A &gt;5.1 · B &gt;4.6</div>
                <div style={{marginTop:4,color:'#64748b'}}>Reg. 2016/2281 · 4 bins</div>
                <div style={{color:'#64748b'}}>20–35°C · Indoor 27°C</div>
              </div>
            </div>
            <div style={{background:'rgba(0,0,0,.25)',borderRadius:12,padding:'16px 14px',border:'1px solid rgba(139,92,246,.25)'}}>
              <div style={{fontSize:9,letterSpacing:'.15em',textTransform:'uppercase',color:'#a855f7',marginBottom:10}}>US DOE / AHRI 210/240</div>
              <div style={{fontFamily:'Syne,sans-serif',fontSize:32,fontWeight:800,color:'#a855f7',lineHeight:1}}>{fn(SEER_US,1)}</div>
              <div style={{fontSize:10,color:'#64748b',marginTop:2,marginBottom:10}}>SEER2 (BTU/Wh)</div>
              <div style={{background:'rgba(139,92,246,.1)',borderRadius:8,padding:'8px 10px',textAlign:'center',border:'1px solid rgba(139,92,246,.3)'}}>
                <div style={{fontFamily:'Syne,sans-serif',fontSize:13,fontWeight:700,color:usRating.color}}>{usRating.cls}</div>
                <div style={{fontSize:10,color:'#64748b',marginTop:2}}>{usRating.detail}</div>
              </div>
              <div style={{marginTop:10,fontSize:9,color:'#475569',lineHeight:1.7}}>
                <div>EER (95F): {fn(EER_US,2)} BTU/Wh</div>
                <div>Energy Star: &gt;22 · Min: 14</div>
                <div style={{marginTop:4,color:'#64748b'}}>AHRI 210/240 · 9 bins</div>
                <div style={{color:'#64748b'}}>67–107°F · Indoor 80°F</div>
              </div>
            </div>
          </div>

          <div className="irow" style={{marginTop:12}}>
            <span><span className="ik">EER full 35°C</span><span className="iv">{fn(capFull35/powFull35,2)}</span></span>
            <span><span className="ik">EER half 35°C</span><span className="iv">{fn(capHalf35/powHalf35,2)}</span></span>
            <span><span className="ik">EER full 29°C</span><span className="iv">{fn(capFull29/powFull29,2)}</span></span>
            <span><span className="ik">EER US (BTU/Wh)</span><span className="iv">{fn(EER_US,2)}</span></span>
          </div>

          <div className="gtip" style={{marginTop:12}}>
            <strong>Half load test clarification:</strong> Half load is tested at 35°C outdoor (not 29°C). The 29°C data point is a full-load reference used only to build the capacity interpolation curve across temperature bins. Half load capacity and power at each bin temperature is derived by scaling proportionally from the 35°C half load measurements. For official BEE certification, laboratory testing per IS 1391 Part 2 is required.
          </div>
        </div>
      )}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
