<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Noditech AB - Cooling Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0a0f1e;font-family:'DM Mono',monospace;color:#e2e8f0}
    .app{min-height:100vh;background:radial-gradient(ellipse at 20% 10%,#0d2240,#0a0f1e 60%);padding:32px 20px}
    .wrap{max-width:740px;margin:0 auto}
    .card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:22px 26px;margin-bottom:14px}
    .slbl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#475569;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.05)}
    .field{margin-bottom:16px}
    .field:last-child{margin-bottom:0}
    .lbl{display:flex;justify-content:space-between;font-size:12px;color:#94a3b8;margin-bottom:6px}
    .utag{font-size:10px;color:#475569;background:rgba(255,255,255,.04);padding:2px 7px;border-radius:4px}
    input[type=number],input[type=text],select{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#f1f5f9;font-family:'DM Mono',monospace;font-size:14px;padding:9px 13px;width:100%;outline:none;-moz-appearance:textfield}
    input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
    input[type=number]:focus,input[type=text]:focus,select:focus{border-color:#38bdf8}
    select option{background:#0f172a}
    input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,.1);outline:none;cursor:pointer;margin-top:7px}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,.2)}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
    .irow{display:flex;flex-wrap:wrap;gap:10px;padding:9px 13px;background:rgba(56,189,248,.05);border:1px solid rgba(56,189,248,.1);border-radius:8px;margin-top:9px}
    .ik{font-size:10px;color:#475569;margin-right:3px;text-transform:uppercase}
    .iv{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;color:#38bdf8}
    .iu{font-size:11px;color:#475569}
    .res{background:linear-gradient(135deg,rgba(14,165,233,.13),rgba(56,189,248,.04));border:1px solid rgba(56,189,248,.28);border-radius:16px;padding:24px 26px;margin-bottom:14px}
    .rl2{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#38bdf8;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid rgba(56,189,248,.15)}
    .rg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .ri{background:rgba(0,0,0,.22);border-radius:10px;padding:13px 15px}
    .ri.big{grid-column:1/-1;background:rgba(56,189,248,.09);border:1px solid rgba(56,189,248,.18)}
    .rn{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#64748b;margin-bottom:6px}
    .rv{font-family:'Syne',sans-serif;font-size:24px;font-weight:700;color:#f0f9ff;line-height:1}
    .ri.big .rv{font-size:34px;color:#38bdf8}
    .ru{font-size:11px;color:#475569;margin-top:3px}
    .fml{font-size:11px;color:#475569;line-height:1.8;padding:11px 15px;background:rgba(255,255,255,.02);border-left:2px solid rgba(56,189,248,.3);border-radius:0 6px 6px 0;margin-top:13px}
    .fml strong{color:#94a3b8}
    .warn{font-size:11px;color:#f87171;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.2);border-radius:6px;padding:8px 12px;margin-top:9px}
    .ok{font-size:11px;color:#22c55e;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);border-radius:6px;padding:8px 12px;margin-top:9px}
    .vb{font-family:'Syne',sans-serif;font-size:16px;font-weight:700}
    .bt{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;font-family:'DM Mono',monospace;font-size:12px;border:none;cursor:pointer;transition:all .2s}
    .bt-g{background:rgba(34,197,94,.12);color:#22c55e;border:1px solid rgba(34,197,94,.25)}
    .bt-b{background:rgba(56,189,248,.12);color:#38bdf8;border:1px solid rgba(56,189,248,.25)}
    .bt-y{background:rgba(251,191,36,.12);color:#fbbf24;border:1px solid rgba(251,191,36,.25)}
    .bt-r{background:rgba(248,113,113,.1);color:#f87171;border:1px solid rgba(248,113,113,.2);padding:4px 9px;font-size:11px;border-radius:5px}
    .brow{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
    .bar-t{height:5px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;margin-top:7px}
    .bar-f{height:100%;border-radius:3px;transition:width .5s}
    .bar-l{display:flex;justify-content:space-between;font-size:10px;color:#64748b;margin-top:9px;margin-bottom:4px}
    .pt{width:100%;border-collapse:collapse;font-size:12px}
    .pt th{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#475569;padding:5px 9px;text-align:left;border-bottom:1px solid rgba(255,255,255,.06)}
    .pt td{padding:8px 9px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:top}
    .pt tr:last-child td{border-bottom:none}
    .pt .re td{color:#94a3b8}
    .pt .rl td{color:#38bdf8}
    .pt .rd td{color:#64748b}
    .badge{display:inline-block;font-size:9px;border-radius:3px;padding:1px 6px;margin-left:5px}
    .bd{background:rgba(251,191,36,.13);color:#fbbf24}
    .bw{background:rgba(56,189,248,.13);color:#38bdf8}
    .bc{background:rgba(34,197,94,.13);color:#22c55e}
    /* Mode selector */
    .modes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:22px}
    .mbt{padding:13px 6px;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.02);color:#475569;font-family:'DM Mono',monospace;font-size:11px;text-align:center;cursor:pointer;transition:all .2s}
    .mbt.on{border-color:#38bdf8;background:rgba(56,189,248,.12);color:#38bdf8}
    .mbt .mi{font-size:22px;display:block;margin-bottom:5px}
    .mbt .ml{font-family:'Syne',sans-serif;font-weight:700;font-size:12px;display:block;margin-bottom:2px}
    .mbt .ms{font-size:10px;color:#475569;display:block}
    .mbt.on .ms{color:rgba(56,189,248,.7)}
    /* Log */
    .lt{width:100%;border-collapse:collapse;font-size:11px}
    .lt th{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#475569;padding:5px 7px;text-align:left;border-bottom:1px solid rgba(255,255,255,.06);white-space:nowrap}
    .lt td{padding:6px 7px;border-bottom:1px solid rgba(255,255,255,.03);color:#94a3b8}
    .lt tr:last-child td{border-bottom:none}
    @media(max-width:520px){.two,.three,.modes,.rg{grid-template-columns:1fr}.ri.big{grid-column:1}.brow{flex-direction:column}}
    @media print{body{background:#fff!important;color:#000!important}.app{background:#fff!important;padding:10px}.card,.res{border:1px solid #ddd!important;background:#fff!important;break-inside:avoid}.rv,.vb,.iv{color:#000!important}.ru,.iu,.ik,.rn,.fml{color:#555!important}.ri{background:#f9f9f9!important}.ri.big{background:#e8f4fd!important}.modes,.brow,.no-print{display:none!important}}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect} = React;

function fmt(n,d=2){if(!isFinite(n)||isNaN(n))return"--";return n.toFixed(d)}
function pSat(T){return 611.21*Math.exp((18.678-T/234.5)*(T/(257.14+T)))}
function humR(T,RH){const pv=(RH/100)*pSat(T);return 0.622*pv/(101325-pv)}
function enth(T,RH){const W=humR(T,RH);return 1.006*T+W*(2501+1.86*T)}
function sVol(T,RH){const pv=(RH/100)*pSat(T);return 287.058*(T+273.15)/(101325-pv)}
function wBulb(T,RH){
  const pv=(RH/100)*pSat(T);let Tw=T-(1-RH/100)*10;
  for(let i=0;i<60;i++){const f=pSat(Tw)-66*(T-Tw)-pv;const df=(pSat(Tw+.001)-pSat(Tw-.001))/.002+66;const d=f/df;Tw-=d;if(Math.abs(d)<.0001)break;}
  return Tw;
}
function eCol(e){if(e>=4)return"#22c55e";if(e>=3)return"#86efac";if(e>=2.5)return"#facc15";return"#f87171"}
function eLbl(e){if(e>=4)return"Excellent";if(e>=3)return"Good";if(e>=2)return"Average";return"Poor"}
function cpGly(p){return 4.18-(4.18-2.38)*(p/100)}
function rhoGly(p){return 1.0+0.0012*p}
const CP=4.186;

function satT(ref,pBar){
  const pAbs=pBar+1.01325,pPa=pAbs*1e5;
  const C={R32:{A:23.2181,B:2525.1,C:-8.34},R290:{A:22.7282,B:2154.7,C:-7.79},R410A:{A:23.1042,B:2564.0,C:-9.21},R22:{A:22.5906,B:2437.0,C:-19.52},R134a:{A:22.59,B:2547.0,C:-22.31},R407C:{A:23.08,B:2600.0,C:-10.0},R404A:{A:22.87,B:2400.0,C:-7.5}};
  const c=C[ref];if(!c)return null;
  return c.B/(c.A-Math.log(pPa))-c.C-273.15;
}
const REFS=['R32','R290','R410A','R22','R134a','R407C','R404A','Other'];
const RCOL={R32:'#a855f7',R290:'#f97316',R410A:'#38bdf8',R22:'#fbbf24',R134a:'#22c55e',R407C:'#f472b6',R404A:'#60a5fa',Other:'#94a3b8'};

function RefSec({unit,refr,setRefr,sP,setSP,dP,setDP,sT,setST}){
  const toC=v=>unit==="F"?(v-32)*5/9:v;
  const sC=unit==="F"?toC(sT):sT;
  const tE=refr!=="Other"?satT(refr,sP):null;
  const tC=refr!=="Other"?satT(refr,dP):null;
  const sh=tE!=null?sC-tE:null;
  const pr=dP>0&&sP>0?(dP+1.01325)/(sP+1.01325):null;
  const rc=RCOL[refr]||'#94a3b8';
  return(
    <div className="card" style={{borderColor:rc+'44'}}>
      <div className="slbl" style={{color:rc}}>Refrigerant - {refr}</div>
      <div className="field">
        <div className="lbl"><span>Refrigerant</span></div>
        <select value={refr} onChange={e=>setRefr(e.target.value)}>{REFS.map(r=><option key={r}>{r}</option>)}</select>
      </div>
      <div className="two">
        <div className="field">
          <div className="lbl"><span>Suction Pressure</span><span className="utag">bar g</span></div>
          <input type="number" min={0} max={60} step={0.1} value={sP} onChange={e=>setSP(parseFloat(e.target.value)||0)}/>
        </div>
        <div className="field">
          <div className="lbl"><span>Discharge Pressure</span><span className="utag">bar g</span></div>
          <input type="number" min={0} max={120} step={0.1} value={dP} onChange={e=>setDP(parseFloat(e.target.value)||0)}/>
        </div>
      </div>
      <div className="field">
        <div className="lbl"><span>Suction Gas Temperature</span><span className="utag">deg {unit}</span></div>
        <input type="number" min={-60} max={100} step={0.1} value={sT} onChange={e=>setST(parseFloat(e.target.value)||0)}/>
      </div>
      {refr!=="Other"&&(
        <div className="three" style={{marginTop:12}}>
          <div style={{background:'rgba(0,0,0,.2)',borderRadius:10,padding:'13px 15px'}}>
            <div className="rn">Evap Temp</div>
            <div className="rv" style={{fontSize:20,color:rc}}>{tE!=null?fmt(tE,1):"--"} C</div>
            <div className="ru">at suction P</div>
          </div>
          <div style={{background:sh!=null&&sh<3?'rgba(248,113,113,.1)':sh!=null&&sh>15?'rgba(251,191,36,.1)':'rgba(34,197,94,.1)',borderRadius:10,padding:'13px 15px',border:sh!=null&&sh<3?'1px solid rgba(248,113,113,.3)':sh!=null&&sh>15?'1px solid rgba(251,191,36,.3)':'1px solid rgba(34,197,94,.2)'}}>
            <div className="rn">Superheat</div>
            <div className="rv" style={{fontSize:20,color:sh!=null&&sh<3?'#f87171':sh!=null&&sh>15?'#fbbf24':'#22c55e'}}>{sh!=null?fmt(sh,1):"--"} K</div>
            <div className="ru">{sh!=null&&sh<3?'Too low!':sh!=null&&sh>15?'Check charge':'Normal'}</div>
          </div>
          <div style={{background:'rgba(0,0,0,.2)',borderRadius:10,padding:'13px 15px'}}>
            <div className="rn">Cond Temp</div>
            <div className="rv" style={{fontSize:20,color:rc}}>{tC!=null?fmt(tC,1):"--"} C</div>
            <div className="ru">at discharge P</div>
          </div>
        </div>
      )}
      {refr!=="Other"&&pr!=null&&(
        <div className="irow" style={{borderColor:rc+'44',background:rc+'11',marginTop:12}}>
          <span><span className="ik">P-ratio</span><span className="iv" style={{color:rc}}>{fmt(pr,2)}</span></span>
          <span><span className="ik">Suction</span><span className="iv" style={{color:rc}}>{fmt(sP,1)}</span><span className="iu"> bar g</span></span>
          <span><span className="ik">Discharge</span><span className="iv" style={{color:rc}}>{fmt(dP,1)}</span><span className="iu"> bar g</span></span>
          {tE!=null&&tC!=null&&<span><span className="ik">dT lift</span><span className="iv" style={{color:rc}}>{fmt(tC-tE,1)}</span><span className="iu"> K</span></span>}
        </div>
      )}
    </div>
  );
}

function AirAir({unit,job,uid,setLog,setShowLog}){
  const [eDB,setEDB]=useState(26);const [eRH,setERH]=useState(50);
  const [lDB,setLDB]=useState(14);const [lRH,setLRH]=useState(90);
  const [oDB,setODB]=useState(35);const [oRH,setORH]=useState(40);
  const [af,setAf]=useState(600);const [pw,setPw]=useState(1.2);
  const [ref,setRef]=useState("R32");const [sP,setSP]=useState(8);const [dP,setDP]=useState(28);const [sT,setST]=useState(15);
  const C=v=>unit==="F"?(v-32)*5/9:v;const F=v=>unit==="F"?v*9/5+32:v;const d=(c,n=1)=>fmt(F(c),n);
  const eC=C(eDB),lC=C(lDB),oC=C(oDB);
  const hE=enth(eC,eRH),vE=sVol(eC,eRH),wE=wBulb(eC,eRH),WE=humR(eC,eRH);
  const hL=enth(lC,lRH),vL=sVol(lC,lRH),wL=wBulb(lC,lRH),WL=humR(lC,lRH);
  const wO=wBulb(oC,oRH),WO=humR(oC,oRH);
  const afs=af/3600,mf=afs/vL,dh=Math.max(0,hE-hL),Q=mf*dh,eer=pw>0?Q/pw:0;
  const dT=eC-lC,sr=dh>0?Math.max(0,Math.min(1,1.006*dT/dh)):0;
  const qs=Q*sr,ql=Q-qs;
  const mn=unit==="F"?23:-5,mx=unit==="F"?113:45,ec=eCol(eer);
  function save(){
    const tE=refr!=="Other"?satT(refr,sP):null;const sC=unit==="F"?C(sT):sT;const sh=tE!=null?sC-tE:null;const tCond=ref!=="Other"?satT(ref,dP):null;
    setLog(p=>[{id:Date.now(),date:new Date().toLocaleString(),mode:'Air/Air',job:job||"--",uid:uid||"--",ref,t1:fmt(F(eC),2),t2:fmt(F(lC),2),wb1:d(wE,2),wb2:d(wL,2),rh1:fmt(eRH,1),rh2:fmt(lRH,1),af,pw:fmt(pw,2),Q:fmt(Q,2),eer:fmt(eer,2),tE:tE!=null?fmt(tE,1):"--",sh:sh!=null?fmt(sh,1):"--",tC:tCond!=null?fmt(tCond,1):"--",sP:fmt(sP,1),dP:fmt(dP,1),unit},...p]);
    setShowLog(true);
  }
  return(<>
    <div className="card">
      <div className="slbl">Inn - Entering Evaporator (Return Air)</div>
      <div className="two">
        <div className="field"><div className="lbl"><span>Dry-Bulb <span className="badge bd">DB</span></span><span className="utag">deg {unit}</span></div>
          <input type="number" min={mn} max={mx} step={0.01} value={eDB} onChange={e=>setEDB(parseFloat(e.target.value)||0)}/>
          <input type="range" min={mn} max={mx} step={0.1} value={eDB} onChange={e=>setEDB(parseFloat(e.target.value))}/>
        </div>
        <div className="field"><div className="lbl"><span>Relative Humidity</span><span className="utag">%</span></div>
          <input type="number" min={5} max={100} step={0.1} value={eRH} onChange={e=>setERH(parseFloat(e.target.value)||0)}/>
          <input type="range" min={5} max={100} step={0.1} value={eRH} onChange={e=>setERH(parseFloat(e.target.value))}/>
        </div>
      </div>
      <div className="irow">
        <span><span className="ik">WBinn</span><span className="iv">{d(wE,2)} deg {unit}</span></span>
        <span><span className="ik">h_inn</span><span className="iv">{fmt(hE)}</span><span className="iu"> kJ/kg</span></span>
        <span><span className="ik">v_inn</span><span className="iv">{fmt(vE,4)}</span><span className="iu"> m3/kg</span></span>
        <span><span className="ik">W_inn</span><span className="iv">{fmt(WE*1000,2)}</span><span className="iu"> g/kg</span></span>
      </div>
    </div>
    <div className="card" style={{borderColor:'rgba(56,189,248,.2)'}}>
      <div className="slbl" style={{color:'#38bdf8'}}>Ut - Leaving Evaporator (Supply Air)</div>
      <div className="two">
        <div className="field"><div className="lbl"><span>Leaving DB <span className="badge bd">DB</span></span><span className="utag">deg {unit} measured</span></div>
          <input type="number" min={mn} max={mx} step={0.01} value={lDB} onChange={e=>setLDB(parseFloat(e.target.value)||0)} style={{borderColor:'rgba(56,189,248,.4)'}}/>
          <input type="range" min={mn} max={mx} step={0.1} value={lDB} onChange={e=>setLDB(parseFloat(e.target.value))}/>
        </div>
        <div className="field"><div className="lbl"><span>Leaving RH</span><span className="utag">% measured</span></div>
          <input type="number" min={5} max={100} step={0.1} value={lRH} onChange={e=>setLRH(parseFloat(e.target.value)||0)} style={{borderColor:'rgba(56,189,248,.4)'}}/>
          <input type="range" min={5} max={100} step={0.1} value={lRH} onChange={e=>setLRH(parseFloat(e.target.value))}/>
        </div>
      </div>
      {lDB>=eDB&&<div className="warn">Leaving DB must be below entering DB</div>}
      <div style={{marginTop:12,padding:'13px 15px',background:'rgba(56,189,248,.07)',border:'1px solid rgba(56,189,248,.18)',borderRadius:8}}>
        <div style={{fontSize:10,letterSpacing:'.15em',textTransform:'uppercase',color:'#38bdf8',marginBottom:9}}>DB + RH - Wet-Bulb Converter</div>
        <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',marginBottom:10}}>
          <div style={{background:'rgba(0,0,0,.25)',borderRadius:8,padding:'9px 14px',textAlign:'center'}}><div style={{fontSize:10,color:'#475569',marginBottom:3}}>DB</div><div style={{fontFamily:'Syne,sans-serif',fontSize:20,fontWeight:700,color:'#f0f9ff'}}>{lDB} deg</div></div>
          <div style={{color:'#475569',fontSize:16}}>+</div>
          <div style={{background:'rgba(0,0,0,.25)',borderRadius:8,padding:'9px 14px',textAlign:'center'}}><div style={{fontSize:10,color:'#475569',marginBottom:3}}>RH</div><div style={{fontFamily:'Syne,sans-serif',fontSize:20,fontWeight:700,color:'#f0f9ff'}}>{lRH}%</div></div>
          <div style={{color:'#475569',fontSize:16}}>-&gt;</div>
          <div style={{background:'rgba(56,189,248,.12)',border:'1px solid rgba(56,189,248,.3)',borderRadius:8,padding:'9px 14px',textAlign:'center'}}><div style={{fontSize:10,color:'#38bdf8',marginBottom:3}}>Wet-Bulb WB</div><div style={{fontFamily:'Syne,sans-serif',fontSize:20,fontWeight:700,color:'#38bdf8'}}>{d(wL,2)} deg</div></div>
        </div>
        <div className="irow" style={{borderColor:'rgba(56,189,248,.18)',background:'rgba(0,0,0,.15)',marginTop:0}}>
          <span><span className="ik">h_ut</span><span className="iv">{fmt(hL)}</span><span className="iu"> kJ/kg</span></span>
          <span><span className="ik">v_ut</span><span className="iv" style={{color:'#fbbf24'}}>{fmt(vL,4)}</span><span className="iu"> m3/kg</span></span>
          <span><span className="ik">W_ut</span><span className="iv">{fmt(WL*1000,2)}</span><span className="iu"> g/kg</span></span>
        </div>
      </div>
    </div>
    <div className="card">
      <div className="slbl">Coil Summary</div>

      </div>}
      <div className="three">
        <div className="field"><div className="lbl"><span>T Inlet</span><span className="utag">deg {unit}</span></div><input type="number" min={-30} max={80} step={0.01} value={hTi} onChange={e=>setHTi(parseFloat(e.target.value)||0)} style={{borderColor:'rgba(251,191,36,.4)'}}/></div>
        <div className="field"><div className="lbl"><span>T Outlet</span><span className="utag">deg {unit}</span></div><input type="number" min={-30} max={80} step={0.01} value={hTo} onChange={e=>setHTo(parseFloat(e.target.value)||0)} style={{borderColor:'rgba(251,191,36,.4)'}}/></div>
        <div className="field"><div className="lbl"><span>Flow</span><span className="utag">m3/h</span></div><input type="number" min={0.01} max={500} step={0.01} value={hF} onChange={e=>setHF(parseFloat(e.target.value)||0)} style={{borderColor:'rgba(251,191,36,.4)'}}/></div>
      </div>
      <div className="irow" style={{borderColor:'rgba(251,191,36,.25)',background:'rgba(251,191,36,.05)'}}>
        <span><span className="ik">dT</span><span className="iv" style={{color:'#fbbf24'}}>{fmt(Math.abs(hTiC-hToC),2)}</span><span className="iu"> K</span></span>
        <span><span className="ik">m</span><span className="iv" style={{color:'#fbbf24'}}>{fmt(mH,3)}</span><span className="iu"> kg/s</span></span>
        <span><span className="ik">Q hot</span><span className="iv" style={{color:'#fbbf24'}}>{fmt(Qh,2)}</span><span className="iu"> kW</span></span>
      </div>
    </div>
    <div className="card">
      <div className="slbl">Electrical Input</div>
      <div className="field"><div className="lbl"><span>Compressor Power</span><span className="utag">kW</span></div>
        <input type="number" min={0.1} max={500} step={0.05} value={pw} onChange={e=>setPw(parseFloat(e.target.value)||0)}/>
      </div>
      <div className="bar-l"><span>COP: <strong style={{color:ec}}>{fmt(eer,2)} - {eLbl(eer)}</strong></span></div>
      <div className="bar-t"><div className="bar-f" style={{width:Math.min(100,(eer/6)*100)+'%',background:ec}}/></div>
    </div>
    <RefSec unit={unit} refr={ref} setRefr={setRef} sP={sP} setSP={setSP} dP={dP} setDP={setDP} sT={sT} setST={setST}/>
    <div className="res">
      <div className="rl2">Results</div>
      <div className="rg">
        <div className="ri big"><div className="rn">Q_cold - Cooling Output</div><div className="rv">{fmt(Qc,2)} kW</div><div className="ru">{fmt(Qc*3412.14,2)} BTU/h - {fmt(Qc/3.517,2)} tons</div></div>
        <div className="ri" style={{background:Math.abs(bal)>10?'rgba(248,113,113,.06)':'rgba(34,197,94,.06)',border:Math.abs(bal)>10?'1px solid rgba(248,113,113,.2)':'1px solid rgba(34,197,94,.2)'}}>
          <div className="rn">Q_hot - Condenser</div>
          <div className="rv" style={{fontSize:22,color:Math.abs(bal)>10?'#f87171':'#22c55e'}}>{fmt(Qh,2)} kW</div>
          <div className="ru">{Math.abs(bal)>10?'Balance error: '+fmt(Math.abs(bal),1)+'%':'Balance OK: '+fmt(Math.abs(bal),1)+'%'}</div>
        </div>
        <div className="ri"><div className="rn">COP / EER</div><div className="rv" style={{color:ec}}>{fmt(eer,2)}</div><div className="ru">Q_cold / P_el</div></div>
        <div className="ri"><div className="rn">P_el</div><div className="rv">{fmt(pw,2)}</div><div className="ru">kW</div></div>
        <div className="ri"><div className="rn">dT cold</div><div className="rv">{fmt(Math.abs(cToC-cTiC),2)}</div><div className="ru">K</div></div>
        <div className="ri"><div className="rn">dT hot</div><div className="rv">{fmt(Math.abs(hTiC-hToC),2)}</div><div className="ru">K</div></div>
      </div>
      <div className="fml">
        <strong>Q_cold</strong> = m x cp x dT = {fmt(mC,3)} kg/s x {fmt(cpC,3)} x {fmt(Math.abs(cToC-cTiC),2)} = <strong>{fmt(Qc,2)} kW</strong><br/>
        <strong>Q_hot</strong> = {fmt(mH,3)} x {fmt(cpH,3)} x {fmt(Math.abs(hTiC-hToC),2)} = <strong>{fmt(Qh,2)} kW</strong><br/>
        <strong>COP</strong> = {fmt(Qc,2)} / {fmt(pw,2)} = <strong>{fmt(eer,2)}</strong>
      </div>
    </div>
    <div className="brow no-print">
      <button className="bt bt-g" onClick={save}>Save Measurement</button>
      <button className="bt bt-b" onClick={()=>window.print()}>Print / PDF</button>
    </div>
  </>);
}

function App(){
  const [mode,setMode]=useState("aa");
  const [unit,setUnit]=useState("C");
  const [job,setJob]=useState("");const [uid,setUid]=useState("");
  const [log,setLog]=useState(()=>{try{return JSON.parse(localStorage.getItem('ndt_log')||'[]')}catch{return[]}});
  const [showLog,setShowLog]=useState(false);
  useEffect(()=>{localStorage.setItem('ndt_log',JSON.stringify(log))},[log]);
  function delEntry(id){setLog(p=>p.filter(e=>e.id!==id))}
  function exportCSV(){
    if(!log.length)return;
    const H=["Date","Mode","Job","Unit","Ref","T1","T2","WB1","WB2","RH1","RH2","Q kW","Qw kW","EER","T_evap","SH K","T_cond","P_suc","P_dis","Temp unit"];
    const R=log.map(e=>[e.date,e.mode,e.job,e.uid,e.ref,e.t1,e.t2,e.wb1,e.wb2,e.rh1,e.rh2,e.Q,e.Qw||"--",e.eer,e.tE,e.sh,e.tC,e.sP,e.dP,e.unit]);
    const csv=[H,...R].map(r=>r.map(c=>'"'+c+'"').join(",")).join("\n");
    const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);a.download="noditech_log.csv";a.click();
  }
  return(
    <div className="app">
      <div className="wrap">
        <div style={{marginBottom:28}}>
          <div style={{fontFamily:'Syne,sans-serif',fontSize:'clamp(34px,7vw,66px)',fontWeight:800,color:'#f0f9ff',letterSpacing:'-.03em',lineHeight:1,marginBottom:5}}>
            Nodi<span style={{color:'#38bdf8'}}>tech</span> <span style={{color:'#38bdf8'}}>AB</span>
          </div>
          <div style={{fontFamily:'Syne,sans-serif',fontSize:'clamp(16px,3vw,24px)',fontWeight:700,color:'#94a3b8',marginBottom:3}}>Cooling and EER Calculator</div>
          <div style={{fontSize:11,color:'#475569',letterSpacing:'.08em',marginBottom:18}}>by Simen Olsen Allum</div>
          <div className="modes">
            {[{id:"aa",icon:"A/A",label:"Air / Air",sub:"Luft til luft"},{id:"al",icon:"A/L",label:"Air / Liquid",sub:"Luft til vann"},{id:"ll",icon:"L/L",label:"Liquid / Liquid",sub:"Vann til vann"}].map(m=>(
              <button key={m.id} className={"mbt"+(mode===m.id?" on":"")} onClick={()=>setMode(m.id)}>
                <span className="mi">{m.icon}</span>
                <span className="ml">{m.label}</span>
                <span className="ms">{m.sub}</span>
              </button>
            ))}
          </div>
        </div>
        <div className="card no-print">
          <div className="slbl">Measurement Info</div>
          <div className="two">
            <div className="field"><div className="lbl">Job / Location</div><input type="text" placeholder="e.g. Office 3rd floor" value={job} onChange={e=>setJob(e.target.value)}/></div>
            <div className="field"><div className="lbl">Unit ID / Serial</div><input type="text" placeholder="e.g. AHU-01" value={uid} onChange={e=>setUid(e.target.value)}/></div>
          </div>
        </div>
        <div className="card no-print">
          <div className="slbl">Temperature Unit</div>
          <div style={{display:'flex',gap:8}}>
            {["C","F"].map(u=><button key={u} onClick={()=>setUnit(u)} style={{flex:1,padding:'9px',borderRadius:8,border:'1px solid',borderColor:unit===u?'#38bdf8':'rgba(255,255,255,.1)',background:unit===u?'rgba(56,189,248,.12)':'rgba(255,255,255,.03)',color:unit===u?'#38bdf8':'#64748b',fontFamily:'DM Mono,monospace',fontSize:13,cursor:'pointer'}}>deg {u}</button>)}
          </div>
        </div>
        {mode==="aa"&&<AirAir unit={unit} job={job} uid={uid} setLog={setLog} setShowLog={setShowLog}/>}
        {mode==="al"&&<AirLiquid unit={unit} job={job} uid={uid} setLog={setLog} setShowLog={setShowLog}/>}
        {mode==="ll"&&<LiqLiq unit={unit} job={job} uid={uid} setLog={setLog} setShowLog={setShowLog}/>}
        <div className="brow no-print" style={{marginTop:8}}>
          <button className="bt bt-y" onClick={()=>setShowLog(v=>!v)}>{showLog?"Hide":"Show"} Log ({log.length})</button>
        </div>
        {showLog&&(
          <div className="card no-print" style={{marginTop:14}}>
            <div className="slbl">Measurement Log</div>
            {log.length===0?<div style={{fontSize:13,color:'#475569',padding:'10px 0'}}>No measurements saved yet.</div>:(
              <>
                <div style={{overflowX:'auto'}}>
                  <table className="lt">
                    <thead><tr><th>Date</th><th>Mode</th><th>Job</th><th>Unit</th><th>Ref</th><th>T1</th><th>T2</th><th>Q kW</th><th>EER</th><th>SH</th><th>T_evap</th><th></th></tr></thead>
                    <tbody>{log.map(e=>(
                      <tr key={e.id}>
                        <td style={{fontSize:10,color:'#64748b',whiteSpace:'nowrap'}}>{e.date}</td>
                        <td style={{fontSize:10}}>{e.mode}</td>
                        <td style={{color:'#f0f9ff'}}>{e.job}</td>
                        <td>{e.uid}</td>
                        <td style={{color:RCOL[e.ref]||'#94a3b8',fontWeight:600}}>{e.ref}</td>
                        <td>{e.t1}</td>
                        <td style={{color:'#38bdf8'}}>{e.t2}</td>
                        <td style={{color:'#38bdf8',fontWeight:600}}>{e.Q}</td>
                        <td style={{color:eCol(parseFloat(e.eer)),fontWeight:600}}>{e.eer}</td>
                        <td>{e.sh}</td>
                        <td>{e.tE}</td>
                        <td><button className="bt-r" onClick={()=>delEntry(e.id)}>x</button></td>
                      </tr>
                    ))}</tbody>
                  </table>
                </div>
                <div className="brow" style={{marginTop:10}}>
                  <button className="bt bt-b" onClick={exportCSV}>Export CSV</button>
                  <button className="bt-r" style={{padding:'7px 12px',fontSize:11}} onClick={()=>{if(window.confirm("Clear all?"))setLog([])}}>Clear All</button>
                </div>
              </>
            )}
          </div>
        )}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
