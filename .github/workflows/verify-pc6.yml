name: verify-pc6

# Lett, deterministisk, browser-fritt sikkerhetsnett for Noditech build 9.7-pc6.
# Beviser at den utrullede appen (de tre inngangsfilene) er byte-for-byte den
# GO-verifiserte pc6-artefakten. Erstatter de pensjonerte rc8-gatene
# (rebind-pc6-ci.yml, step3-browser-gate.yml).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify pc6 identity (byte-for-byte)
        run: |
          set -euo pipefail
          EXPECTED=b9f8be84731b9038a814ecc32b876d8856d8526ccf28cd35cc1bb1d74167dc50
          fail=0
          for f in Kalkulator_build9.7-pc6.html index.html Kalkulator.html; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::missing file"
              fail=1
              continue
            fi
            actual=$(sha256sum "$f" | awk '{print $1}')
            echo "$f -> $actual"
            if [ "$actual" != "$EXPECTED" ]; then
              echo "::error file=$f::SHA-256 mismatch (expected $EXPECTED, got $actual)"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "pc6 identity check FAILED"
            exit 1
          fi
          echo "All three entrypoints are byte-for-byte pc6."

      - name: Verify manifest
        run: sha256sum -c SHA256SUMS.pc6.txt
