name: noditech-governance-app-check

on:
  pull_request_target:
    branches: [main]
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
ƒ      - edited
  issue_comment:
    types:
      - created
      - edited
      - deleted

permissions:
  contents: read

concurrency:
  group: noditech-governance-app-check-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  publish-governance-check:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: governance-gate
    steps:
      - name: Evaluate policy and publish dedicated App check
        shell: bash
        env:
          APP_ID: ${{ secrets.NODITECH_GOV_APP_ID }}
          INSTALLATION_ID: ${{ secrets.NODITECH_GOV_INSTALLATION_ID }}
          APP_PRIVATE_KEY: ${{ secrets.NODITECH_GOV_PRIVATE_KEY }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          node <<'NODE'
          'use strict';

          const crypto = require('crypto');
          const fs = require('fs');
          const https = require('https');

          const appId = process.env.APP_ID;
          const installationId = process.env.INSTALLATION_ID;
          const privateKey = process.env.APP_PRIVATE_KEY;
          const repository = process.env.REPOSITORY;
          const prNumber = Number(process.env.PR_NUMBER);
          const missing = [
  ['APP_ID', appId],
  ['INSTALLATION_ID', installationId],
  ['APP_PRIVATE_KEY', privateKey],
  ['REPOSITORY', repository],
  ['PR_NUMBER', Number.isInteger(prNumber) && prNumber > 0 ? String(prNumber) : '']
].filter(([, value]) => !value).map(([name]) => name);

if (missing.length) {
  throw new Error(`required GitHub App configuration is missing: ${missing.join(', ')}`);
}

          function b64url(value) {
            return Buffer.from(value)
              .toString('base64')
              .replace(/=/g, '')
              .replace(/\+/g, '-')
              .replace(/\//g, '_');
          }

          function createAppJwt() {
            const now = Math.floor(Date.now() / 1000);
            const header = b64url(JSON.stringify({ alg: 'RS256', typ: 'JWT' }));
            const payload = b64url(JSON.stringify({
              iat: now - 60,
              exp: now + 540,
              iss: appId
            }));
            const unsigned = `${header}.${payload}`;
            const signature = crypto.sign(
              'RSA-SHA256',
              Buffer.from(unsigned),
              privateKey
            );
            return `${unsigned}.${b64url(signature)}`;
          }

          function request(method, path, token, body = undefined, accept = 'application/vnd.github+json') {
            return new Promise((resolve, reject) => {
              const payload = body === undefined ? undefined : JSON.stringify(body);
              const req = https.request({
                hostname: 'api.github.com',
                path,
                method,
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: accept,
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'noditech-governance-gate',
                  ...(payload ? {
                    'Content-Type': 'application/json',
                    'Content-Length': Buffer.byteLength(payload)
                  } : {})
                }
              }, res => {
                let text = '';
                res.setEncoding('utf8');
                res.on('data', chunk => { text += chunk; });
                res.on('end', () => {
                  if (res.statusCode < 200 || res.statusCode >= 300) {
                    reject(new Error(`${method} ${path} -> ${res.statusCode}: ${text.slice(0, 1000)}`));
                    return;
                  }
                  if (!text) {
                    resolve(null);
                    return;
                  }
                  try {
                    resolve(JSON.parse(text));
                  } catch (error) {
                    reject(new Error(`invalid GitHub API JSON from ${path}: ${error.message}`));
                  }
                });
              });
              req.on('error', reject);
              if (payload) req.write(payload);
              req.end();
            });
          }

          async function paginate(path, token) {
            const values = [];
            for (let page = 1; ; page += 1) {
              const separator = path.includes('?') ? '&' : '?';
              const batch = await request('GET', `${path}${separator}per_page=100&page=${page}`, token);
              if (!Array.isArray(batch)) {
                throw new Error(`expected array from ${path}`);
              }
              values.push(...batch);
              if (batch.length < 100) return values;
            }
          }

          function isDocumentationOnly(path) {
            return path === 'README.md' ||
              path === 'CHANGELOG.md' ||
              path === 'LICENSE' ||
              path === 'NOTICE' ||
              path.startsWith('docs/');
          }

          async function upsertCheck(token, sha, result) {
            const name = 'noditech-governance-approval';
            const externalId = `noditech-governance:pr=${prNumber}:sha=${sha}`;
            const encodedName = encodeURIComponent(name);
            const existing = await request(
              'GET',
              `/repos/${repository}/commits/${sha}/check-runs?check_name=${encodedName}&per_page=100`,
              token,
              undefined,
              'application/vnd.github+json'
            );

            const matching = (existing?.check_runs || [])
              .filter(check => check.external_id === externalId)
              .sort((a, b) => b.id - a.id)[0];

            const body = {
              name,
              head_sha: sha,
              external_id: externalId,
              status: 'completed',
              conclusion: result.conclusion,
              completed_at: new Date().toISOString(),
              output: {
                title: result.title,
                summary: result.summary,
                text: result.text
              }
            };

            if (matching) {
              const updateBody = { ...body };
              delete updateBody.name;
              delete updateBody.head_sha;
              await request(
                'PATCH',
                `/repos/${repository}/check-runs/${matching.id}`,
                token,
                updateBody
              );
            } else {
              await request(
                'POST',
                `/repos/${repository}/check-runs`,
                token,
                body
              );
            }
          }

          (async () => {
            const jwt = createAppJwt();
            const installation = await request(
              'POST',
              `/app/installations/${installationId}/access_tokens`,
              jwt,
              {}
            );
            const token = installation?.token;
            if (!token) throw new Error('failed to obtain GitHub App installation token');

            const pr = await request(
              'GET',
              `/repos/${repository}/pulls/${prNumber}`,
              token
            );

            if (pr.state !== 'open') {
              console.log(`PR #${prNumber} is not open; no check update required`);
              return;
            }

            const [files, comments] = await Promise.all([
              paginate(`/repos/${repository}/pulls/${prNumber}/files`, token),
              paginate(`/repos/${repository}/issues/${prNumber}/comments`, token)
            ]);

            const changed = files.map(file => file.filename).sort();
            if (!changed.length) throw new Error('pull request has no changed files');

            const governed = changed.filter(path => !isDocumentationOnly(path));
            const owner = pr.base.repo.owner.login;
            const headSha = pr.head.sha;
            const baseSha = pr.base.sha;
            const command = `/noditech-governance-approve pr=${prNumber} head=${headSha} base=${baseSha}`;

            const approval = comments.find(comment =>
              String(comment.body || '').trim() === command &&
              comment.user?.login === owner &&
              comment.user?.type === 'User' &&
              comment.author_association === 'OWNER'
            );

            const approved = governed.length === 0 || Boolean(approval);
            const result = {
              conclusion: approved ? 'success' : 'failure',
              title: approved
                ? 'Noditech governance approved'
                : 'Noditech governance approval required',
              summary: approved
                ? (governed.length === 0
                    ? 'Documentation-only change passed the base-controlled policy.'
                    : `Exact owner approval found for PR #${prNumber}, head ${headSha}, base ${baseSha}.`)
                : `Missing exact owner approval: ${command}`,
              text: [
                `PR: #${prNumber}`,
                `Head: ${headSha}`,
                `Base: ${baseSha}`,
                `Changed files: ${changed.length}`,
                `Governed files: ${governed.length}`,
                `Exact command: ${command}`,
                '',
                ...governed.map(path => `- ${path}`)
              ].join('\n')
            };

            const targets = new Set([headSha]);
            if (/^[0-9a-f]{40}$/i.test(pr.merge_commit_sha || '')) {
              targets.add(pr.merge_commit_sha);
            }

            for (const sha of targets) {
              await upsertCheck(token, sha, result);
              console.log(`Published ${result.conclusion} governance check on ${sha}`);
            }

            fs.appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              [
                `## ${result.title}`,
                '',
                result.summary,
                '',
                `- PR: #${prNumber}`,
                `- Head: \`${headSha}\``,
                `- Base: \`${baseSha}\``,
                `- Merge candidate: \`${pr.merge_commit_sha || 'unavailable'}\``,
                `- Governed files: ${governed.length}`,
                `- Dedicated App check: \`noditech-governance-approval\``
              ].join('\n') + '\n'
            );

            if (!approved) process.exit(1);
          })().catch(error => {
            console.error(`::error::${error.stack || error.message}`);
            process.exit(1);
          });
          NODE
