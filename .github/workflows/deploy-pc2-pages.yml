name: deploy-pc2-pages

on:
  pull_request:
    branches: [main]
    paths:
      - "build/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/deploy-pc2-pages.yml"
  push:
    branches: [main]
    paths:
      - "build/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/deploy-pc2-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  EXPECTED_PC2_SHA256: 0814fb96c351d405029b556f33b984530c59aeb4c12fce2ac01228bec059a424

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build pc2
        run: node build/assemble-pc2.js

      - name: Verify artifact SHA-256
        shell: bash
        run: |
          set -euo pipefail
          actual="$(sha256sum dist/Kalkulator_build9.8-pc2.html | awk '{print $1}')"
          test "$actual" = "$EXPECTED_PC2_SHA256"
          echo "Verified pc2 SHA-256: $actual"

      - name: Run pc2 tests
        run: node --test tests/engine/*.test.js tests/build/*.test.js

      - name: Run integration gates
        run: |
          npm run extract
          npm run compile
          npm run preflight
          npm run offline

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build and verify pc2
        shell: bash
        run: |
          set -euo pipefail
          node build/assemble-pc2.js
          actual="$(sha256sum dist/Kalkulator_build9.8-pc2.html | awk '{print $1}')"
          test "$actual" = "$EXPECTED_PC2_SHA256"

      - name: Prepare Pages site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp dist/Kalkulator_build9.8-pc2.html _site/index.html
          cp dist/Kalkulator_build9.8-pc2.html _site/Kalkulator.html
          cp dist/Kalkulator_build9.8-pc2.html _site/Kalkulator_build9.8-pc2.html
          printf '%s  %s\n' "$EXPECTED_PC2_SHA256" "Kalkulator_build9.8-pc2.html" > _site/SHA256.txt
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
