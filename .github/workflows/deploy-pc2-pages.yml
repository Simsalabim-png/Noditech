name: deploy-pc2-pages

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "build/**"
      - "src/**"
      - "tests/**"
      - "tools/release/**"
      - ".github/workflows/deploy-pc2-pages.yml"
  push:
    branches: [main]
    paths:
      - "build/**"
      - "src/**"
      - "tests/**"
      - "tools/release/**"
      - ".github/workflows/deploy-pc2-pages.yml"
  workflow_dispatch:
    inputs:
      expected_ref:
        description: "Exact branch or tag to deploy"
        required: true
        default: "safe-release-20260701-pr60"
      expected_sha:
        description: "Exact commit SHA to deploy"
        required: true
        default: "fa61f81dc94f934c2cdd421e3267b70cfa243268"
      deploy:
        description: "Set to true to deploy"
        required: true
        default: "false"

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  EXPECTED_PC2_SHA256: e41bd3e9c14e6e8588c8de4ba40e3329cf7e4d464d8007f6b8cb75e9ed51c4ba
  EXPECTED_DRAFT_PC2_SHA256: a6ab0f73b42377790a4d349eb22afac301dec0bd0d149a0fba91e7499801a8dd

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Checkout requested ref
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.inputs.expected_ref }}
          fetch-depth: 0

      - name: Verify requested SHA
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_DEPLOY_SHA: ${{ github.event.inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_DEPLOY_SHA"
          echo "Verified requested SHA: $EXPECTED_DEPLOY_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Resolve artifact SHA guard for event state
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.draft }}" = "true" ]; then
            echo "EXPECTED_ACTIVE_PC2_SHA256=$EXPECTED_DRAFT_PC2_SHA256" >> "$GITHUB_ENV"
            echo "::notice::Draft PR: verifying PR-1A candidate artifact SHA only; deploy/release SHA guard remains $EXPECTED_PC2_SHA256"
          else
            echo "EXPECTED_ACTIVE_PC2_SHA256=$EXPECTED_PC2_SHA256" >> "$GITHUB_ENV"
            echo "::notice::Release-capable event: enforcing deploy/release artifact SHA guard"
          fi

      - name: Build pc2 Liquid/Liquid release
        run: node build/assemble-pc2-ll-release.js

      - name: Verify artifact SHA-256
        shell: bash
        run: |
          set -euo pipefail
          actual="$(sha256sum dist/Kalkulator_build9.8-pc2.html | awk '{print $1}')"
          if [ "$EXPECTED_ACTIVE_PC2_SHA256" = "$EXPECTED_PC2_SHA256" ] && [ "$actual" = "$EXPECTED_DRAFT_PC2_SHA256" ]; then
            echo "::error::release-capable verification produced the DRAFT artifact (sha256 ${actual}); the draft artifact SHA is never deployable"
            exit 1
          fi
          test "$actual" = "$EXPECTED_ACTIVE_PC2_SHA256"
          echo "Verified pc2 SHA-256: $actual"

      - name: Run pc2 tests
        run: node --test tests/engine/*.test.js tests/build/*.test.js

      - name: Run integration gates
        run: |
          npm run extract
          npm run compile
          npm run preflight
          npm run offline

  deploy:
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Checkout requested ref
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.inputs.expected_ref }}
          fetch-depth: 0

      - name: Verify requested SHA
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_DEPLOY_SHA: ${{ github.event.inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_DEPLOY_SHA"
          echo "Verified requested SHA: $EXPECTED_DEPLOY_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Build and verify pc2 Liquid/Liquid release
        shell: bash
        run: |
          set -euo pipefail
          node build/assemble-pc2-ll-release.js
          actual="$(sha256sum dist/Kalkulator_build9.8-pc2.html | awk '{print $1}')"
          test "$actual" = "$EXPECTED_PC2_SHA256"

      - name: Prepare Pages site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp dist/Kalkulator_build9.8-pc2.html _site/index.html
          cp dist/Kalkulator_build9.8-pc2.html _site/Kalkulator.html
          cp dist/Kalkulator_build9.8-pc2.html _site/Kalkulator_build9.8-pc2.html
          printf '%s  %s\n' "$EXPECTED_PC2_SHA256" "Kalkulator_build9.8-pc2.html" > _site/SHA256.txt
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Verify published Liquid/Liquid release
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_PC2_SHA256: ${{ env.EXPECTED_PC2_SHA256 }}
        run: node tools/release/verify-published.js
