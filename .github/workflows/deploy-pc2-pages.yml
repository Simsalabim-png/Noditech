name: deploy-pc2-pages

on:
  pull_request:
    branches: [main]
    paths:
      - "build/**"
      - "src/**"
      - "tests/**"
      - "tools/release/**"
      - ".github/workflows/deploy-pc2-pages.yml"
  push:
    branches: [main]
    paths:
      - "build/**"
      - "src/**"
      - "tests/**"
      - "tools/release/**"
      - ".github/workflows/deploy-pc2-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  EXPECTED_PC2_SHA256: 1ef3926dfc1257a9812fc591a237da5b79ef538900f96dd39287a249874f6c31

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Build pc2 Liquid/Liquid release
        run: node build/assemble-pc2-ll-release.js

      - name: Verify artifact SHA-256
        shell: bash
        run: |
          set -euo pipefail
          actual="$(sha256sum dist/Kalkulator_build9.8-pc2.html | awk '{print $1}')"
          test "$actual" = "$EXPECTED_PC2_SHA256"
          echo "Verified pc2 SHA-256: $actual"

      - name: Run pc2 tests
        run: node --test tests/engine/*.test.js tests/build/*.test.js

      - name: Run integration gates
        run: |
          npm run extract
          npm run compile
          npm run preflight
          npm run offline

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Build and verify pc2 Liquid/Liquid release
        shell: bash
        run: |
          set -euo pipefail
          node build/assemble-pc2-ll-release.js
          actual="$(sha256sum dist/Kalkulator_build9.8-pc2.html | awk '{print $1}')"
          test "$actual" = "$EXPECTED_PC2_SHA256"

      - name: Prepare Pages site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp dist/Kalkulator_build9.8-pc2.html _site/index.html
          cp dist/Kalkulator_build9.8-pc2.html _site/Kalkulator.html
          cp dist/Kalkulator_build9.8-pc2.html _site/Kalkulator_build9.8-pc2.html
          printf '%s  %s\n' "$EXPECTED_PC2_SHA256" "Kalkulator_build9.8-pc2.html" > _site/SHA256.txt
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Verify published Liquid/Liquid release
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_PC2_SHA256: ${{ env.EXPECTED_PC2_SHA256 }}
        run: node tools/release/verify-published.js
