name: verify-develop

on:
  push:
    branches:
      - develop
      - "feature/**"
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run validation, build, and engine tests
        run: |
          set -euo pipefail
          node --test             tests/validation/*.test.js             tests/build/*.test.js             tests/engine/*.test.js

      - name: Verify deterministic build
        run: |
          set -euo pipefail
          node build/verify-reproducible.js

      - name: Verify private harness skips safely without private data
        run: |
          set -euo pipefail
          output="$(node src/validation/cli.js)"
          printf '%s\n' "$output"
          case "$output" in
            SKIPPED*) ;;
            *)
              echo "::error::Expected public-safe SKIPPED result without private data"
              exit 1
              ;;
          esac

      - name: Verify pc6 remains unchanged
        run: |
          set -euo pipefail
          EXPECTED=b9f8be84731b9038a814ecc32b876d8856d8526ccf28cd35cc1bb1d74167dc50
          for file in Kalkulator_build9.7-pc6.html index.html Kalkulator.html; do
            actual="$(sha256sum "$file" | awk '{print $1}')"
            test "$actual" = "$EXPECTED" || {
              echo "::error file=$file::pc6 SHA-256 mismatch"
              exit 1
            }
          done
