name: verify-hardening-redeploy

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-hardening-evidence.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_SHA: cb888c6a8cd943a2bdb8a252ebe8236d8743cc8e
      EXPECTED_SHA256: 1ef3926dfc1257a9812fc591a237da5b79ef538900f96dd39287a249874f6c31
      SITE_URL: https://simsalabim-png.github.io/Noditech/
    steps:
      - name: Confirm push deployment succeeded
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          runs="$(curl --fail --silent --show-error "$api/actions/runs?head_sha=$TARGET_SHA&event=push&per_page=100")"
          run_id="$(printf '%s' "$runs" | jq -r '[.workflow_runs[] | select(.name == "deploy-pc2-pages" and .head_sha == env.TARGET_SHA)] | sort_by(.run_number) | last | .id // empty')"
          conclusion="$(printf '%s' "$runs" | jq -r '[.workflow_runs[] | select(.name == "deploy-pc2-pages" and .head_sha == env.TARGET_SHA)] | sort_by(.run_number) | last | .conclusion // empty')"
          test -n "$run_id"
          test "$conclusion" = "success"
          jobs="$(curl --fail --silent --show-error "$api/actions/runs/$run_id/jobs?per_page=100")"
          test "$(printf '%s' "$jobs" | jq -r '[.jobs[] | select(.name == "verify")][0].conclusion')" = "success"
          test "$(printf '%s' "$jobs" | jq -r '[.jobs[] | select(.name == "deploy")][0].conclusion')" = "success"
          test "$(printf '%s' "$jobs" | jq -r '[.jobs[] | select(.name == "deploy")][0].steps[] | select(.name == "Verify published Liquid/Liquid release") | .conclusion')" = "success"
          echo "Verified deploy run: $run_id"

      - name: Verify live artifact bytes and markers
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 6 --retry-delay 10 --retry-all-errors -H 'Cache-Control: no-cache' -o published.html "${SITE_URL}?verify=${TARGET_SHA}"
          curl --fail --location --retry 6 --retry-delay 10 --retry-all-errors -H 'Cache-Control: no-cache' -o SHA256.txt "${SITE_URL}SHA256.txt?verify=${TARGET_SHA}"
          actual="$(sha256sum published.html | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA256"
          grep -q "$EXPECTED_SHA256" SHA256.txt
          grep -q 'NoditechLiquidLiquid' published.html
          grep -q 'data-ll-cutover' published.html
          grep -q 'CoolProp 7.2.0 INCOMP' published.html
          if grep -Eqi 'text/babel|https://cdnjs.cloudflare.com|fonts.googleapis.com' published.html; then exit 1; fi
          echo "Verified live hardening redeploy: $actual"
