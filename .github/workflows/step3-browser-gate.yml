name: Step 3 Browser Gate

# Real Chromium A–H gate for the Step 3 A/L atmospheric-pressure correction.

# The tested application loads ONLY from the package-local 127.0.0.1 server; the runner blocks all external

# application requests. The CI runner may fetch its own runner software / browser via the CI environment.

on:
push:
pull_request:
workflow_dispatch:

permissions:
contents: read

jobs:
chromium-gate:
runs-on: ubuntu-latest
steps:
- name: Checkout package
uses: actions/checkout@v4

```
  - name: Set up Node 22
    uses: actions/setup-node@v4
    with:
      node-version: '22'

  - name: Install Google Chrome (stable)
    id: setup-chrome
    uses: browser-actions/setup-chrome@v1
    with:
      chrome-version: stable

  - name: Verify package checksums
    run: sha256sum -c SHA256SUMS.txt

  - name: Pre-browser validation (structural + JS syntax, 18/18)
    run: node tests/run_preflight.js

  - name: Resolve CHROMIUM_BIN explicitly
    run: |
      BIN="${{ steps.setup-chrome.outputs.chrome-path }}"
      if [ -z "$BIN" ] || [ ! -x "$BIN" ]; then
        BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium || true)"
      fi
      if [ -z "$BIN" ]; then echo "No Chromium found"; exit 1; fi
      echo "CHROMIUM_BIN=$BIN" >> "$GITHUB_ENV"
      echo "Resolved CHROMIUM_BIN=$BIN"
      "$BIN" --version || true

  - name: Real Chromium A–H gate (app served only from package-local localhost)
    run: node chromium/run_chromium.js

  - name: Upload browser evidence (always)
    if: ${{ always() }}
    uses: actions/upload-artifact@v4
    with:
      name: step3-chromium-evidence
      if-no-files-found: warn
      path: |
        chromium/results/chromium_result.json
        chromium/results/chromium_junit.xml
        chromium/results/render_root_diagnostic.json
        chromium/results/chromium_console.log
        chromium/results/chromium_page_errors.log
        chromium/results/chromium_stderr.log
        chromium/results/chromium_network.log
        screenshots/**

  - name: Publish JUnit summary (always)
    if: ${{ always() }}
    run: |
      echo "### Step 3 Chromium gate" >> "$GITHUB_STEP_SUMMARY"
      if [ -f chromium/results/chromium_result.json ]; then
        node -e "const j=require('./chromium/results/chromium_result.json');console.log('- status: '+j.status);console.log('- chromium: '+(j.chromium_version||''));console.log('- summary: '+JSON.stringify(j.summary||{}));console.log('- external app requests: '+JSON.stringify(j.network_external_requests||j.server_request_count||[]));" >> "$GITHUB_STEP_SUMMARY"
      fi
```
