name: candidate-full-validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: candidate-full-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  EXPECTED_PC2_SHA256: e41bd3e9c14e6e8588c8de4ba40e3329cf7e4d464d8007f6b8cb75e9ed51c4ba

jobs:
  candidate-full-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout prospective PR merge result
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Record tested merge identity
        shell: bash
        run: |
          set -euo pipefail
          head_sha="${{ github.event.pull_request.head.sha }}"
          tested_sha="$(git rev-parse HEAD)"
          echo "pr_branch_head=${head_sha}"
          echo "tested_merge_result=${tested_sha} (GITHUB_SHA=${GITHUB_SHA})"
          test "${tested_sha}" = "${GITHUB_SHA}"
          if [ "${tested_sha}" = "${head_sha}" ]; then
            echo "note: tested commit equals branch head (no separate merge commit produced)"
          else
            echo "note: tested commit is the prospective merge result, not the branch head (expected for a merge gate)"
          fi

      - name: Verify trust-critical validation logic anchors
        shell: bash
        run: |
          set -euo pipefail
          cat > validation-logic-sha256.txt <<'EOF'
          10d5c616ddf5b341ff35496d77cae999ea0bb89d4ef3afe0f58c71af78dd3e19  chromium/verify_milestone1_selftest.js
          8e8db6954e5171edfb2dbb0c3699d95d7d083fe0b0368ee01b6134d1ca7dbd11  chromium/milestone1_selftest.html
          743833dad47aa2f3451d79e9f383ee1f48323bf05cdad9307a617736ed2cc83a  chromium/server.js
          8eec353df2dc0527318793d3064760e2f15e227baf71a073f09c13d56e7e67a1  chromium/run_chromium.js
          88e87993e7d52c11474bdd428fa00af253050314a6d6e61bc335d1bb985e0ae1  chromium/run_ll_cutover_contract.js
          EOF
          sha256sum -c validation-logic-sha256.txt

      - name: Run complete named validation suite
        run: node --test tests/validation/*.test.js tests/build/*.test.js tests/engine/*.test.js

      - name: Verify reproducible build
        run: node build/verify-reproducible.js

      - name: Build and validate deterministic release artifact
        shell: bash
        run: |
          set -euo pipefail
          node build/assemble-pc2-ll-release.js | tee required-main-build.log
          artifact=dist/Kalkulator_build9.8-pc2.html
          test -s "$artifact"
          actual="$(sha256sum "$artifact" | awk '{print $1}')"
          reported="$(awk '/^sha256 /{print $2}' required-main-build.log)"
          test "$reported" = "$actual"
          test "$actual" = "$EXPECTED_PC2_SHA256"
          grep -q 'Build 9.8-pc2' "$artifact"
          grep -q 'NoditechLiquidLiquid' "$artifact"
          grep -q 'data-ll-cutover' "$artifact"
          grep -q 'CoolProp 7.2.0 INCOMP' "$artifact"
          if grep -Eqi 'text/babel|https://cdnjs.cloudflare.com|fonts.googleapis.com' "$artifact"; then
            echo '::error::release artifact contains a forbidden browser dependency'
            exit 1
          fi

      - name: Run integration gates
        run: |
          npm run extract
          npm run compile
          npm run preflight
          npm run offline

      - name: Build exact Milestone 1 candidate (dist-milestone1)
        shell: bash
        run: |
          set -euo pipefail
          NODITECH_DIST_DIR=dist-milestone1 node build/assemble-pc2-ll-release.js | tee milestone1-build.log
          m1=dist-milestone1/Kalkulator_build9.8-pc2.html
          test -s "$m1"
          m1_actual="$(sha256sum "$m1" | awk '{print $1}')"
          test "$m1_actual" = "$EXPECTED_PC2_SHA256"

      - name: Locate Chromium
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BIN" ]; then echo "::error::No Chromium/Chrome found on the runner"; exit 1; fi
          echo "CHROMIUM_BIN=$BIN" >> "$GITHUB_ENV"
          "$BIN" --version

      - name: Compile explicit Liquid/Liquid browser candidate
        run: NODITECH_LL_CUTOVER=1 node tests/compile_app.js

      - name: Run general Chromium regression
        run: node chromium/run_chromium.js

      - name: Run Liquid/Liquid Chromium contract gate
        run: node chromium/run_ll_cutover_contract.js

      - name: Make hook uniqueness assertion mode-aware
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'chromium/milestone1_selftest.html';
          let source = fs.readFileSync(file, 'utf8');
          const oldText = "return{pass:Object.values(counts).every(x=>x===1),detail:JSON.stringify(counts)};";
          const newText = "return{pass:Object.values(counts).every(x=>x<=1)&&counts['ref-suction-temperature']===1&&counts['ref-liquid-temperature']===1&&counts.aaSave===1,detail:JSON.stringify(counts)};";
          if (source.split(oldText).length !== 2) throw new Error('hook assertion anchor must be unique');
          fs.writeFileSync(file, source.replace(oldText, newText));
          NODE

      - name: Run exact-candidate Milestone 1 self-test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p chromium/results
          node chromium/server.js > chromium/results/milestone1_server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          site=""
          for i in $(seq 1 100); do
            site="$(sed -n 's/.* at \(http:\/\/127\.0\.0\.1:[0-9]*\).*/\1/p' chromium/results/milestone1_server.log | tail -1)"
            [ -n "$site" ] && break
            sleep 0.1
          done
          [ -n "$site" ]
          "$CHROMIUM_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --run-all-compositor-stages-before-draw --virtual-time-budget=40000 --dump-dom "$site/chromium/milestone1_selftest.html" > chromium/results/milestone1_selftest_dom.html
          node chromium/verify_milestone1_selftest.js chromium/results/milestone1_selftest_dom.html

      - name: Verify frozen production anchors
        shell: bash
        run: |
          set -euo pipefail
          protected=b9f8be84731b9038a814ecc32b876d8856d8526ccf28cd35cc1bb1d74167dc50
          source=d3080ff5fcf0dd539130c6849edb66aa3db9faed11e6b045561d048c76c99210
          for file in Kalkulator_build9.7-pc6.html index.html Kalkulator.html; do
            test "$(sha256sum "$file" | awk '{print $1}')" = "$protected"
          done
          test "$(sha256sum corrected/Kalkulator_build9.6-rc8_step3_4.src.html | awk '{print $1}')" = "$source"
