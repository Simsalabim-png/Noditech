name: package-m1-working-copy

on:
  push:
    branches:
      - packaging/m1-workingcopy-f14edb4
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact M1 implementation head with full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: f14edb4770a1e58147b4b3efb2c4d47d79c44822
          fetch-depth: 0

      - name: Set up Node.js matching CI
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Build complete working-copy package inputs
        shell: bash
        run: bash tools/package-m1-working-copy.sh

      - name: Upload complete M1 working-copy package inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Noditech_M1_WorkingCopy_f14edb4_inputs
          path: package-out/**
          if-no-files-found: error
          retention-days: 7
