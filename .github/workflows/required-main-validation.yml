name: required-main-validation

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: required-main-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  required-main-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enforce base-controlled governance policy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          OWNER_LOGIN: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          node <<'NODE'
          'use strict';
          const https = require('https');
          const fs = require('fs');

          const token = process.env.GH_TOKEN;
          const repository = process.env.REPOSITORY;
          const pr = Number(process.env.PR_NUMBER);
          const head = process.env.HEAD_SHA;
          const base = process.env.BASE_SHA;
          const owner = process.env.OWNER_LOGIN;

          if (!token || !repository || !pr || !head || !base || !owner) {
            throw new Error('required pull-request metadata is missing');
          }

          function api(path) {
            return new Promise((resolve, reject) => {
              const req = https.request({
                hostname: 'api.github.com',
                path,
                method: 'GET',
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'noditech-required-main-validation'
                }
              }, res => {
                let body = '';
                res.setEncoding('utf8');
                res.on('data', chunk => { body += chunk; });
                res.on('end', () => {
                  if (res.statusCode < 200 || res.statusCode >= 300) {
                    reject(new Error(`GitHub API ${res.statusCode}: ${body.slice(0, 500)}`));
                    return;
                  }
                  try { resolve(JSON.parse(body)); }
                  catch (error) { reject(new Error(`invalid GitHub API JSON: ${error.message}`)); }
                });
              });
              req.on('error', reject);
              req.end();
            });
          }

          async function paginate(path) {
            const all = [];
            for (let page = 1; ; page += 1) {
              const separator = path.includes('?') ? '&' : '?';
              const batch = await api(`${path}${separator}per_page=100&page=${page}`);
              if (!Array.isArray(batch)) throw new Error(`expected array from ${path}`);
              all.push(...batch);
              if (batch.length < 100) return all;
            }
          }

          function isDocumentationOnly(path) {
            return path === 'README.md' ||
              path === 'CHANGELOG.md' ||
              path === 'LICENSE' ||
              path === 'NOTICE' ||
              path.startsWith('docs/');
          }

          (async () => {
            const [files, comments] = await Promise.all([
              paginate(`/repos/${repository}/pulls/${pr}/files`),
              paginate(`/repos/${repository}/issues/${pr}/comments`)
            ]);

            const changed = files.map(file => file.filename).sort();
            if (!changed.length) throw new Error('pull request has no changed files');

            const governed = changed.filter(path => !isDocumentationOnly(path));
            const command = `/noditech-governance-approve pr=${pr} head=${head} base=${base}`;
            const approval = comments.find(comment =>
              String(comment.body || '').trim() === command &&
              comment.user &&
              comment.user.login === owner &&
              comment.user.type === 'User' &&
              comment.author_association === 'OWNER'
            );

            const summary = [
              '## Required main validation',
              '',
              `- PR: #${pr}`,
              `- Head: \`${head}\``,
              `- Base: \`${base}\``,
              `- Changed files: ${changed.length}`,
              `- Governed files: ${governed.length}`,
              `- Owner approval required: ${governed.length ? 'yes' : 'no'}`,
              `- Exact approval command: \`${command}\``
            ];

            if (governed.length) {
              summary.push('', '### Governed paths', ...governed.map(path => `- \`${path}\``));
            }

            if (!governed.length) {
              summary.push('', 'Documentation-only change: base-controlled policy passed without an override.');
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join('\n') + '\n');
              console.log('BASE-CONTROLLED POLICY PASS: documentation-only change');
              return;
            }

            if (!approval) {
              summary.push('', '### Result', 'BLOCKED: exact owner approval for this head/base pair was not found.');
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join('\n') + '\n');
              console.error(`::error::Governed changes require this exact owner comment: ${command}`);
              process.exit(1);
            }

            summary.push(
              '',
              '### Result',
              `APPROVED by repository owner \`${approval.user.login}\` in comment ${approval.id}, created ${approval.created_at}.`,
              '',
              'The approval is bound to both the current PR head and current base SHA. Any new push or base update requires a new exact approval.'
            );
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join('\n') + '\n');
            console.log(`BASE-CONTROLLED POLICY PASS: exact owner approval comment ${approval.id}`);
          })().catch(error => {
            console.error(`::error::${error.stack || error.message}`);
            process.exit(1);
          });
          NODE
