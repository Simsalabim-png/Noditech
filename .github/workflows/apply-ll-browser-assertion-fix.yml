name: apply-ll-browser-assertion-fix

on:
  push:
    branches:
      - automation/ll-review-fixes-213b42f

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cutover branch
        uses: actions/checkout@v4
        with:
          ref: feature/liquid-liquid-live-cutover
          fetch-depth: 0

      - name: Correct selector escaping and guarantee runner exit
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('chromium/run_ll_cutover_contract.js')
          s=p.read_text()
          old1='document.querySelector("[data-ll-useful-capacity=\\"true\\"]")!==null'
          new1='document.querySelector("[data-ll-useful-capacity]")!==null'
          old2='process.exitCode=fails?1:0;'
          new2='process.exit(fails?1:0);'
          if s.count(old1)!=1 or s.count(old2)!=1:
              raise SystemExit('expected runner anchors not found exactly once')
          p.write_text(s.replace(old1,new1).replace(old2,new2))
          PY
          node --check chromium/run_ll_cutover_contract.js
          git diff --check

      - name: Commit to cutover branch
        run: |
          git config user.name 'Noditech Review Automation'
          git config user.email 'review-automation@users.noreply.github.com'
          git add chromium/run_ll_cutover_contract.js
          git commit -m 'fix(browser): correct assertion escaping and runner exit'
          git push origin HEAD:feature/liquid-liquid-live-cutover
