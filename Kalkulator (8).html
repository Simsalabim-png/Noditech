<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Noditech AB — Cooling Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0a0f1e;font-family:'DM Mono',monospace;min-height:100vh;color:#e2e8f0}
    .app{min-height:100vh;background:radial-gradient(ellipse at 20% 10%,#0d2240 0%,#0a0f1e 60%),radial-gradient(ellipse at 80% 90%,#0a1f35 0%,transparent 60%);padding:40px 20px}
    .container{max-width:740px;margin:0 auto}
    .header{margin-bottom:32px}
    h1{font-family:'Syne',sans-serif;font-size:clamp(26px,5vw,42px);font-weight:800;line-height:1.1;color:#f0f9ff;letter-spacing:-0.02em;margin-bottom:8px}
    h1 span{color:#38bdf8}
    .subtitle{font-size:13px;color:#64748b;letter-spacing:.02em}
    .card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:24px 28px;margin-bottom:14px}
    .section-label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#475569;margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.05)}
    .field{margin-bottom:18px}
    .field:last-child{margin-bottom:0}
    .lbl{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#94a3b8;margin-bottom:7px;letter-spacing:.04em}
    .lbl .utag{font-size:10px;color:#475569;background:rgba(255,255,255,.04);padding:2px 7px;border-radius:4px}
    input[type="number"],input[type="text"],select{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#f1f5f9;font-family:'DM Mono',monospace;font-size:15px;padding:10px 14px;width:100%;outline:none;transition:border-color .2s,background .2s;-moz-appearance:textfield}
    input[type="number"]::-webkit-outer-spin-button,input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none}
    input[type="number"]:focus,input[type="text"]:focus,select:focus{border-color:#38bdf8;background:rgba(56,189,248,.06)}
    select option{background:#0f172a}
    input[type="range"]{-webkit-appearance:none;width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,.1);outline:none;cursor:pointer;margin-top:8px}
    input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,.2);transition:box-shadow .2s}
    input[type="range"]:hover::-webkit-slider-thumb{box-shadow:0 0 0 6px rgba(56,189,248,.2)}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
    .pt{width:100%;border-collapse:collapse;font-size:13px}
    .pt th{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#475569;padding:6px 10px;text-align:left;border-bottom:1px solid rgba(255,255,255,.06)}
    .pt td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:top}
    .pt tr:last-child td{border-bottom:none}
    .pt .r-enter td{color:#94a3b8}
    .pt .r-leave td{color:#38bdf8}
    .pt .r-delta td{color:#64748b}
    .rl{font-size:9px;letter-spacing:.1em;text-transform:uppercase}
    .wb{display:inline-block;font-size:9px;background:rgba(56,189,248,.13);color:#38bdf8;border-radius:3px;padding:1px 6px;margin-left:5px}
    .db{display:inline-block;font-size:9px;background:rgba(251,191,36,.13);color:#fbbf24;border-radius:3px;padding:1px 6px;margin-left:5px}
    .calc-tag{display:inline-block;font-size:9px;background:rgba(34,197,94,.13);color:#22c55e;border-radius:3px;padding:1px 6px;margin-left:6px}
    .results{background:linear-gradient(135deg,rgba(14,165,233,.13) 0%,rgba(56,189,248,.04) 100%);border:1px solid rgba(56,189,248,.28);border-radius:16px;padding:26px 28px;margin-bottom:14px;position:relative;overflow:hidden}
    .results::before{content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;background:radial-gradient(circle,rgba(56,189,248,.09) 0%,transparent 70%);pointer-events:none}
    .rl2{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#38bdf8;margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid rgba(56,189,248,.15)}
    .rgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .ri{background:rgba(0,0,0,.22);border-radius:10px;padding:14px 16px}
    .ri.big{grid-column:1/-1;background:rgba(56,189,248,.09);border:1px solid rgba(56,189,248,.18)}
    .ri.warn-card{background:rgba(248,113,113,.06);border:1px solid rgba(248,113,113,.2)}
    .ri.ok-card{background:rgba(34,197,94,.06);border:1px solid rgba(34,197,94,.2)}
    .rn{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#64748b;margin-bottom:7px}
    .rv{font-family:'Syne',sans-serif;font-size:26px;font-weight:700;color:#f0f9ff;line-height:1}
    .ri.big .rv{font-size:36px;color:#38bdf8}
    .ru{font-size:11px;color:#475569;margin-top:4px}
    .bar-track{height:5px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;margin-top:8px}
    .bar-fill{height:100%;border-radius:3px;transition:width .5s cubic-bezier(.4,0,.2,1)}
    .bar-lbls{display:flex;justify-content:space-between;font-size:10px;color:#64748b;margin-bottom:5px;margin-top:10px}
    .formula{font-size:12px;color:#475569;line-height:1.8;padding:12px 16px;background:rgba(255,255,255,.02);border-left:2px solid rgba(56,189,248,.3);border-radius:0 6px 6px 0;margin-top:14px}
    .formula strong{color:#94a3b8}
    .info-row{display:flex;align-items:baseline;gap:10px;padding:10px 14px;background:rgba(56,189,248,.05);border:1px solid rgba(56,189,248,.1);border-radius:8px;margin-top:10px;flex-wrap:wrap}
    .info-row .ik{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#475569;margin-right:4px}
    .info-row .iv{font-family:'Syne',sans-serif;font-size:17px;font-weight:700;color:#38bdf8}
    .info-row .iu{font-size:11px;color:#475569}
    .warn{font-size:11px;color:#f87171;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.2);border-radius:6px;padding:8px 12px;margin-top:10px}
    .vb{font-family:'Syne',sans-serif;font-size:17px;font-weight:700;line-height:1.1}
    button{cursor:pointer}
    /* Mode selector */
    .mode-selector{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:24px}
    .mode-btn{padding:14px 8px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.02);color:#475569;font-family:'DM Mono',monospace;font-size:12px;text-align:center;transition:all .2s;cursor:pointer}
    .mode-btn.active{border-color:#38bdf8;background:rgba(56,189,248,.12);color:#38bdf8}
    .mode-btn .mode-icon{font-size:24px;margin-bottom:6px;display:block}
    .mode-btn .mode-label{font-family:'Syne',sans-serif;font-weight:700;font-size:13px;display:block;margin-bottom:2px}
    .mode-btn .mode-sub{font-size:10px;color:#475569;display:block}
    .mode-btn.active .mode-sub{color:#38bdf8;opacity:.7}
    /* Log table */
    .log-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:4px}
    .log-table th{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#475569;padding:6px 8px;text-align:left;border-bottom:1px solid rgba(255,255,255,.06);white-space:nowrap}
    .log-table td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.03);color:#94a3b8;vertical-align:middle}
    .log-table tr:hover td{background:rgba(255,255,255,.02)}
    .log-table tr:last-child td{border-bottom:none}
    .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:8px;font-family:'DM Mono',monospace;font-size:13px;font-weight:500;border:none;transition:all .2s;cursor:pointer}
    .btn-primary{background:rgba(56,189,248,.15);color:#38bdf8;border:1px solid rgba(56,189,248,.3)}
    .btn-primary:hover{background:rgba(56,189,248,.25)}
    .btn-success{background:rgba(34,197,94,.12);color:#22c55e;border:1px solid rgba(34,197,94,.25)}
    .btn-success:hover{background:rgba(34,197,94,.22)}
    .btn-amber{background:rgba(251,191,36,.12);color:#fbbf24;border:1px solid rgba(251,191,36,.25)}
    .btn-amber:hover{background:rgba(251,191,36,.22)}
    .btn-danger{background:rgba(248,113,113,.1);color:#f87171;border:1px solid rgba(248,113,113,.2);padding:4px 10px;font-size:11px;border-radius:5px}
    .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
    .ref-badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:4px;margin-left:6px;font-weight:500}    @media print{
      body{background:#fff!important;color:#000!important}
      .no-print{display:none!important}
      .app{background:#fff!important;padding:10px}
      .card,.results{border:1px solid #ddd!important;background:#fff!important;break-inside:avoid}
      .section-label,.rl2{color:#333!important;border-color:#ddd!important}
      .rv,.vb,.info-row .iv{color:#000!important}
      .ru,.info-row .iu,.info-row .ik,.rn,.formula{color:#555!important}
      .ri{background:#f9f9f9!important}
      .ri.big{background:#e8f4fd!important}
      .formula{border-left-color:#38bdf8!important}
      .print-header{display:block!important}
      input,select{border:1px solid #ccc!important;background:#f9f9f9!important;color:#000!important}
      .mode-selector,.btn-row{display:none!important}
    }
    .print-header{display:none;margin-bottom:20px;padding-bottom:12px;border-bottom:2px solid #38bdf8}
    @media(max-width:520px){
      .two-col,.three-col,.mode-selector{grid-template-columns:1fr}
      .rgrid{grid-template-columns:1fr}
      .ri.big{grid-column:1}
      .info-row{flex-direction:column;gap:6px}
      .btn-row{flex-direction:column}
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

// ── Helpers ───────────────────────────────────────────────────────────────
function fmt(n,dec=2){if(!isFinite(n)||isNaN(n))return"—";return n.toFixed(dec)}
function pSat(T){return 611.21*Math.exp((18.678-T/234.5)*(T/(257.14+T)))}
function humRatio(T,RH){const pv=(RH/100)*pSat(T);return 0.622*pv/(101325-pv)}
function enthalpy(T,RH){const W=humRatio(T,RH);return 1.006*T+W*(2501+1.86*T)}
function specVol(T,RH){const pv=(RH/100)*pSat(T);return 287.058*(T+273.15)/(101325-pv)}
function wetBulb(T,RH){
  const pv=(RH/100)*pSat(T);let Tw=T-(1-RH/100)*10;
  for(let i=0;i<60;i++){const f=pSat(Tw)-66*(T-Tw)-pv;const df=(pSat(Tw+.001)-pSat(Tw-.001))/.002+66;const d=f/df;Tw-=d;if(Math.abs(d)<.0001)break;}
  return Tw;
}
function eerColor(e){if(e>=4)return"#22c55e";if(e>=3)return"#86efac";if(e>=2.5)return"#facc15";return"#f87171"}
function eerLabel(e){if(e>=4)return"Excellent";if(e>=3)return"Good";if(e>=2)return"Average";return"Poor"}

// Glycol cp (kJ/kg·K) — ethylene glycol/water mix
function cpGlycol(pct){
  // Linear approx: pure water=4.18, 50% EG≈3.48, 100% EG≈2.38
  return 4.18 - (4.18-2.38)*(pct/100);
}
// Glycol density (kg/L) at ~10°C
function rhoGlycol(pct){
  return 1.0 + 0.0012*pct; // approx
}
// Water cp
const CP_WATER = 4.186; // kJ/kg·K

// Refrigerant sat temp
function satTempFromPressure(refrig,pBar){
  const pAbs=pBar+1.01325;const pPa=pAbs*1e5;
  const coeffs={R32:{A:23.2181,B:2525.1,C:-8.34},R290:{A:22.7282,B:2154.7,C:-7.79},R410A:{A:23.1042,B:2564.0,C:-9.21},R22:{A:22.5906,B:2437.0,C:-19.52},R134a:{A:22.5900,B:2547.0,C:-22.31},R407C:{A:23.0800,B:2600.0,C:-10.00},R404A:{A:22.8700,B:2400.0,C:-7.50}};
  const c=coeffs[refrig];if(!c)return null;
  const lnP=Math.log(pPa);const T_K=c.B/(c.A-lnP)-c.C;return T_K-273.15;
}
const REFRIGERANTS=['R32','R290','R410A','R22','R134a','R407C','R404A','Other'];
const REF_COLORS={R32:'#a855f7',R290:'#f97316',R410A:'#38bdf8',R22:'#fbbf24',R134a:'#22c55e',R407C:'#f472b6',R404A:'#60a5fa',Other:'#94a3b8'};

// ── Shared components ─────────────────────────────────────────────────────
function RefrigerantSection({unit,refrig,setRefrig,suctionP,setSuctionP,dischargeP,setDischargeP,suctionTemp,setSuctionTemp}){
  const toC=v=>unit==="F"?(v-32)*5/9:v;
  const suctionC=unit==="F"?toC(suctionTemp):suctionTemp;
  const tEvap=refrig!=="Other"?satTempFromPressure(refrig,suctionP):null;
  const tCond=refrig!=="Other"?satTempFromPressure(refrig,dischargeP):null;
  const superheat=tEvap!=null?suctionC-tEvap:null;
  const pRatio=dischargeP>0&&suctionP>0?(dischargeP+1.01325)/(suctionP+1.01325):null;
  const refColor=REF_COLORS[refrig]||'#94a3b8';
  return(
    <div className="card" style={{borderColor:`${refColor}33`}}>
      <div className="section-label" style={{color:refColor,borderColor:`${refColor}22`}}>
        Refrigerant Side
        <span className="ref-badge" style={{background:`${refColor}22`,color:refColor,border:`1px solid ${refColor}44`,marginLeft:8}}>{refrig}</span>
      </div>
      <div className="field">
        <div className="lbl"><span>Refrigerant</span></div>
        <select value={refrig} onChange={e=>setRefrig(e.target.value)}>
          {REFRIGERANTS.map(r=><option key={r} value={r}>{r}</option>)}
        </select>
      </div>
      <div className="two-col">
        <div className="field">
          <div className="lbl"><span><Tip id="psuction" label="Suction Pressure"/>/span><span className="utag">bar gauge</span></div>
          <input type="number" min={0} max={60} step={0.1} value={suctionP} onChange={e=>setSuctionP(parseFloat(e.target.value)||0)}/>
        </div>
        <div className="field">
          <div className="lbl"><span><Tip id="pdischarge" label="Discharge Pressure"/>/span><span className="utag">bar gauge</span></div>
          <input type="number" min={0} max={120} step={0.1} value={dischargeP} onChange={e=>setDischargeP(parseFloat(e.target.value)||0)}/>
        </div>
      </div>
      <div className="field">
        <div className="lbl"><span><Tip id="superheat" label="Suction Gas Temperature"/>/span><span className="utag">°{unit}</span></div>
        <input type="number" min={-60} max={100} step={0.1} value={suctionTemp} onChange={e=>setSuctionTemp(parseFloat(e.target.value)||0)}/>
      </div>
      {refrig!=="Other"&&(
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12,marginTop:14}}>
          <div style={{background:'rgba(0,0,0,0.2)',borderRadius:10,padding:'14px 16px'}}>
            <div className="rn"><Tip id="tevap" label="Evaporating Temp"/>/div>
            <div className="rv" style={{fontSize:22,color:refColor}}>{tEvap!=null?fmt(tEvap,1):"—"}°C</div>
            <div className="ru">at suction pressure</div>
          </div>
          <div style={{background:superheat!=null&&superheat<3?'rgba(248,113,113,0.1)':superheat!=null&&superheat>15?'rgba(251,191,36,0.1)':'rgba(34,197,94,0.1)',borderRadius:10,padding:'14px 16px',border:superheat!=null&&superheat<3?'1px solid rgba(248,113,113,0.3)':superheat!=null&&superheat>15?'1px solid rgba(251,191,36,0.3)':'1px solid rgba(34,197,94,0.2)'}}>
            <div className="rn"><Tip id="superheat" label="Superheat"/>/div>
            <div className="rv" style={{fontSize:22,color:superheat!=null&&superheat<3?'#f87171':superheat!=null&&superheat>15?'#fbbf24':'#22c55e'}}>{superheat!=null?fmt(superheat,1):"—"} K</div>
            <div className="ru">{superheat!=null&&superheat<3?'⚠ For lav — væskerisiko':superheat!=null&&superheat>15?'⚠ Høy — sjekk ladning':'✓ Normalt område'}</div>
          </div>
          <div style={{background:'rgba(0,0,0,0.2)',borderRadius:10,padding:'14px 16px'}}>
            <div className="rn"><Tip id="tcond" label="Condensing Temp"/>/div>
            <div className="rv" style={{fontSize:22,color:refColor}}>{tCond!=null?fmt(tCond,1):"—"}°C</div>
            <div className="ru">at discharge pressure</div>
          </div>
        </div>
      )}
      {refrig!=="Other"&&pRatio!=null&&(
        <div className="info-row" style={{borderColor:`${refColor}33`,background:`${refColor}11`,marginTop:14}}>
          <span><span className="ik">Pressure Ratio</span><span className="iv" style={{color:refColor}}>{fmt(pRatio,2)}</span></span>
          <span><span className="ik">Suction</span><span className="iv" style={{color:refColor}}>{fmt(suctionP,1)}</span><span className="iu"> bar g</span></span>
          <span><span className="ik">Discharge</span><span className="iv" style={{color:refColor}}>{fmt(dischargeP,1)}</span><span className="iu"> bar g</span></span>
          {tEvap!=null&&tCond!=null&&<span><span className="ik">ΔT løft</span><span className="iv" style={{color:refColor}}>{fmt(tCond-tEvap,1)}</span><span className="iu"> K</span></span>}
        </div>
      )}
    </div>
  );
}

// ── Air/Air Calculator ────────────────────────────────────────────────────
function AirAirCalc({unit,jobName,unitId,log,setLog,setShowLog}){
  const [enterDB,setEnterDB]=useState(26);const [enterRH,setEnterRH]=useState(50);
  const [leaveDB,setLeaveDB]=useState(14);const [leaveRHinput,setLeaveRHinput]=useState(90);
  const [outdoorDB,setOutdoorDB]=useState(35);const [outdoorRH,setOutdoorRH]=useState(40);
  const [airflowM3h,setAirflowM3h]=useState(600);const [powerKW,setPowerKW]=useState(1.2);
  const [refrig,setRefrig]=useState("R32");const [suctionP,setSuctionP]=useState(8.0);
  const [dischargeP,setDischargeP]=useState(28.0);const [suctionTemp,setSuctionTemp]=useState(15.0);

  const toC=v=>unit==="F"?(v-32)*5/9:v;
  const fromC=v=>unit==="F"?v*9/5+32:v;
  const disp=(c,dec=1)=>fmt(fromC(c),dec);
  const enterC=toC(enterDB),leaveC=toC(leaveDB),outdoorC=toC(outdoorDB);
  const h_enter=enthalpy(enterC,enterRH),v_enter=specVol(enterC,enterRH),wb_enter=wetBulb(enterC,enterRH),W_enter=humRatio(enterC,enterRH);
  const W_leave=humRatio(leaveC,leaveRHinput),wb_leave=wetBulb(leaveC,leaveRHinput),h_leave=enthalpy(leaveC,leaveRHinput),v_leave=specVol(leaveC,leaveRHinput);
  const wb_outdoor=wetBulb(outdoorC,outdoorRH),W_outdoor=humRatio(outdoorC,outdoorRH);
  const airflowM3s=airflowM3h/3600,massFlow=airflowM3s/v_leave,dh=Math.max(0,h_enter-h_leave),coolingKW=massFlow*dh,eer=powerKW>0?coolingKW/powerKW:0;
  const deltaDB=enterC-leaveC,sensRatio=dh>0?Math.max(0,Math.min(1,(1.006*deltaDB)/dh)):0;
  const q_sensible=coolingKW*sensRatio,q_latent=coolingKW-q_sensible;
  const tempMin=unit==="F"?23:-5,tempMax=unit==="F"?113:45,eColor=eerColor(eer);

  function save(){
    const tEvap=refrig!=="Other"?satTempFromPressure(refrig,suctionP):null;
    const sC=unit==="F"?toC(suctionTemp):suctionTemp;
    const sh=tEvap!=null?sC-tEvap:null;
    const tCond=refrig!=="Other"?satTempFromPressure(refrig,dischargeP):null;
    setLog(p=>[{id:Date.now(),date:new Date().toLocaleString(),mode:'Air/Air',job:jobName||"—",unitId:unitId||"—",refrig,
      t_inn:fmt(fromC(enterC),2),t_ut:fmt(fromC(leaveC),2),wb_inn:disp(wb_enter,2),wb_ut:disp(wb_leave,2),
      rh_inn:fmt(enterRH,1),rh_ut:fmt(leaveRHinput,1),h_inn:fmt(h_enter,2),h_ut:fmt(h_leave,2),
      airflow:airflowM3h,powerKW:fmt(powerKW,2),cooling:fmt(coolingKW,2),eer:fmt(eer,2),
      tEvap:tEvap!=null?fmt(tEvap,1):"—",superheat:sh!=null?fmt(sh,1):"—",tCond:tCond!=null?fmt(tCond,1):"—",
      suctionP:fmt(suctionP,1),dischargeP:fmt(dischargeP,1),unit},...p]);
    setShowLog(true);
  }

  return(<>
    {/* Entering */}
    <div className="card">
      <div className="section-label">Inn — Entering Evaporator (Return Air)</div>
      <div className="two-col">
        <div className="field">
          <div className="lbl"><span><Tip id="db" label="Dry-Bulb"/> <span className="db">DB</span></span><span className="utag">°{unit}</span></div>
          <input type="number" min={tempMin} max={tempMax} step={0.01} value={enterDB} onChange={e=>setEnterDB(parseFloat(e.target.value)||0)}/>

        <tbody>
          <tr className="r-enter"><td><span className="rl">Inn</span></td><td><span className="vb">{disp(enterC,2)}</span></td><td><span className="vb">{disp(wb_enter,2)}</span></td><td><span className="vb">{fmt(enterRH,1)}</span></td><td><span className="vb">{fmt(h_enter)}</span></td><td><span className="vb">{fmt(v_enter,4)}</span></td><td><span className="vb">{fmt(W_enter*1000,2)}</span></td></tr>

          <tr className="r-delta"><td><span className="rl">Δ</span></td><td>{fmt(Math.abs(enterC-leaveC),2)}↓</td><td>{fmt(Math.abs(wb_enter-wb_leave),2)}↓</td><td>{fmt(Math.abs(leaveRHinput-enterRH),1)}{leaveRHinput>enterRH?'↑':'↓'}</td><td>{fmt(dh,2)}↓</td><td>—</td><td>{fmt(Math.abs(W_enter-W_leave)*1000,2)}↓</td></tr>
        </tbody>

    {/* Outdoor */}
    <div className="card" style={{borderColor:'rgba(251,191,36,0.18)'}}>
      <div className="section-label" style={{color:'#fbbf24'}}>Outdoor Unit — Ambient (Condenser)</div>
      <div className="two-col">
        <div className="field">
          <div className="lbl"><span>Ambient DB</span><span className="utag">°{unit}</span></div>
          <div style={{display:'flex',alignItems:'center',gap:12}}><input type="range" min={tempMin} max={tempMax} value={outdoorDB} onChange={e=>setOutdoorDB(Number(e.target.value))} style={{marginTop:0}}/><span style={{fontSize:18,fontWeight:500,color:'#fbbf24',minWidth:50}}>{outdoorDB}°</span></div>
        </div>

          <div className="lbl"><span><Tip id="rh" label="Relative Humidity"/>span className="utag">%</span></div>
          <div style={{display:'flex',alignItems:'center',gap:12}}><input type="range" min={5} max={100} value={outdoorRH} onChange={e=>setOutdoorRH(Number(e.target.value))} style={{marginTop:0}}/><span style={{fontSize:18,fontWeight:500,color:'#fbbf24',minWidth:50}}>{outdoorRH}%</span></div>
        </div>
      </div>
      <div className="info-row" style={{borderColor:'rgba(251,191,36,0.18)',background:'rgba(251,191,36,0.05)'}}>
        <span><span className="ik">DB</span><span className="iv" style={{color:'#fbbf24'}}>{disp(outdoorC)}°{unit}</span></span>
        <span><span className="ik">WB</span><span className="iv" style={{color:'#fbbf24'}}>{disp(wb_outdoor,2)}°{unit}</span></span>
        <span><span className="ik">RH</span><span className="iv" style={{color:'#fbbf24'}}>{outdoorRH}%</span></span>
        <span><span className="ik">W</span><span className="iv" style={{color:'#fbbf24'}}>{fmt(W_outdoor*1000,2)}</span><span className="iu"> g/kg</span></span>
      </div>
    </div>
    {/* Refrigerant */}

    {/* Airflow + Power */}
    <div className="card">
      <div className="section-label">Airflow & Electrical Input</div>
      <div className="two-col">
        <div className="field">
          <div className="lbl"><span><Tip id="airflow" label="Airflow — measured at outlet"/>/span><span className="utag">m³/h</span></div>
          <input type="number" min={10} max={50000} step={10} value={airflowM3h} onChange={e=>setAirflowM3h(parseFloat(e.target.value)||0)}/>
          <div style={{fontSize:11,color:'#475569',marginTop:6}}>= {fmt(airflowM3s*1000,1)} L/s · {fmt(airflowM3s,4)} m³/s</div>
        </div>
        <div className="field">
          <div className="lbl"><span><Tip id="pel" label="Compressor Power"/> Pₐ</span><span className="utag">kW</span></div>
          <input type="number" min={0.1} max={500} step={0.05} value={powerKW} onChange={e=>setPowerKW(parseFloat(e.target.value)||0)}/>
        </div>
      </div>
      <div style={{marginTop:14}}>
        <div className="bar-lbls"><span>EER / COP: <strong style={{color:eColor}}>{fmt(eer,2)} — {eerLabel(eer)}</strong></span></div>
        <div className="bar-track"><div className="bar-fill" style={{width:`${Math.min(100,(eer/6)*100)}%`,background:eColor}}/></div>
      </div>
    </div>
    {/* Results */}
    <div className="results">
      <div className="rl2">Calculated Output</div>
      <div className="rgrid">
        <div className="ri big"><div className="rn">Q<sub>tot</sub> — Total Cooling Output</div><div className="rv">{fmt(coolingKW,2)} kW</div><div className="ru">{fmt(coolingKW*3412.14,0)} BTU/h · {fmt(coolingKW/3.517,2)} tons</div></div>
        <div className="ri"><div className="rn"><Tip id="eer" label="EER / COP"/>/div><div className="rv" style={{color:eColor}}>{fmt(eer,2)}</div><div className="ru">Q<sub>tot</sub> ÷ P<sub>el</sub></div></div>
        <div className="ri"><div className="rn"><Tip id="massflow" label="ṁ — Mass Flow"/>/div><div className="rv">{fmt(massFlow,3)}</div><div className="ru">kg/s = V̇ ÷ v<sub>ut</sub></div></div>
        <div className="ri"><div className="rn"><Tip id="dh" label="Δh — Enthalpy Drop"/>/div><div className="rv">{fmt(dh,2)}</div><div className="ru">kJ/kg enthalpy drop</div></div>
        <div className="ri"><div className="rn"><Tip id="shr" label="Sensible Qs"/>/div><div className="rv">{fmt(q_sensible,2)}</div><div className="ru">kW (SHR {fmt(sensRatio,2)})</div></div>
        <div className="ri"><div className="rn"><Tip id="shr" label="Latent Ql"/>/div><div className="rv">{fmt(q_latent,2)}</div><div className="ru">kW (dehumid.)</div></div>
      </div>
      <div className="formula">
        <strong>ṁ</strong> = V̇ ÷ v<sub>ut</sub> = {fmt(airflowM3s,4)} ÷ {fmt(v_leave,4)} = {fmt(massFlow,4)} kg/s<br/>
        <strong>Q<sub>tot</sub></strong> = ṁ · (h<sub>inn</sub> − h<sub>ut</sub>) = {fmt(massFlow,4)} × ({fmt(h_enter,2)} − {fmt(h_leave,2)}) = <strong>{fmt(coolingKW,2)} kW</strong><br/>
        <strong>EER</strong> = {fmt(coolingKW,2)} ÷ {fmt(powerKW,2)} = <strong>{fmt(eer,2)}</strong>
      </div>
    </div>
    <div className="btn-row no-print">
      <button className="btn btn-success" onClick={save}>💾 Lagre måling</button>
      <button className="btn btn-primary" onClick={()=>window.print()}>🖨 Print / PDF</button>
    </div>
  </>);
}

// ── Air/Liquid Calculator ─────────────────────────────────────────────────
function AirLiquidCalc({unit,jobName,unitId,log,setLog,setShowLog}){
  const [enterDB,setEnterDB]=useState(26);const [enterRH,setEnterRH]=useState(50);
  const [leaveDB,setLeaveDB]=useState(14);const [leaveRHinput,setLeaveRHinput]=useState(90);
  const [waterTin,setWaterTin]=useState(7);const [waterTout,setWaterTout]=useState(12);
  const [waterFlowLs,setWaterFlowLs]=useState(0.5);
  const [airflowM3h,setAirflowM3h]=useState(600);const [powerKW,setPowerKW]=useState(1.2);
  const [refrig,setRefrig]=useState("R32");const [suctionP,setSuctionP]=useState(8.0);
  const [dischargeP,setDischargeP]=useState(28.0);const [suctionTemp,setSuctionTemp]=useState(15.0);

  const toC=v=>unit==="F"?(v-32)*5/9:v;
  const fromC=v=>unit==="F"?v*9/5+32:v;
  const disp=(c,dec=1)=>fmt(fromC(c),dec);
  const enterC=toC(enterDB),leaveC=toC(leaveDB);
  const waterTinC=toC(waterTin),waterToutC=toC(waterTout);
  const h_enter=enthalpy(enterC,enterRH),v_enter=specVol(enterC,enterRH),wb_enter=wetBulb(enterC,enterRH),W_enter=humRatio(enterC,enterRH);
  const wb_leave=wetBulb(leaveC,leaveRHinput),h_leave=enthalpy(leaveC,leaveRHinput),v_leave=specVol(leaveC,leaveRHinput),W_leave=humRatio(leaveC,leaveRHinput);
  const airflowM3s=airflowM3h/3600,massFlowAir=airflowM3s/v_leave;
  const dh=Math.max(0,h_enter-h_leave),qAirKW=massFlowAir*dh;
  // Water side: Q = ṁ_water * cp * ΔT,  ṁ = flow(L/s) * rho(kg/L)
  const massFlowWater=waterFlowLs*1.0; // water density ~1 kg/L
  const qWaterKW=massFlowWater*CP_WATER*Math.abs(waterToutC-waterTinC);
  const eer=powerKW>0?qAirKW/powerKW:0;
  const balance=qAirKW>0?((qWaterKW-qAirKW)/qAirKW)*100:0;
  const tempMin=unit==="F"?23:-5,tempMax=unit==="F"?113:45,eColor=eerColor(eer);
  const deltaDB=enterC-leaveC,sensRatio=dh>0?Math.max(0,Math.min(1,(1.006*deltaDB)/dh)):0;

  function save(){
    const tEvap=refrig!=="Other"?satTempFromPressure(refrig,suctionP):null;
    const sC=unit==="F"?toC(suctionTemp):suctionTemp;
    const sh=tEvap!=null?sC-tEvap:null;
    const tCond=refrig!=="Other"?satTempFromPressure(refrig,dischargeP):null;
    setLog(p=>[{id:Date.now(),date:new Date().toLocaleString(),mode:'Air/Liquid',job:jobName||"—",unitId:unitId||"—",refrig,
      t_inn:fmt(fromC(enterC),2),t_ut:fmt(fromC(leaveC),2),wb_inn:disp(wb_enter,2),wb_ut:disp(wb_leave,2),
      rh_inn:fmt(enterRH,1),rh_ut:fmt(leaveRHinput,1),h_inn:fmt(h_enter,2),h_ut:fmt(h_leave,2),
      w_tin:fmt(fromC(waterTinC),2),w_tout:fmt(fromC(waterToutC),2),w_flow:fmt(waterFlowLs,3),
      airflow:airflowM3h,powerKW:fmt(powerKW,2),cooling:fmt(qAirKW,2),qWater:fmt(qWaterKW,2),eer:fmt(eer,2),
      tEvap:tEvap!=null?fmt(tEvap,1):"—",superheat:sh!=null?fmt(sh,1):"—",tCond:tCond!=null?fmt(tCond,1):"—",
      suctionP:fmt(suctionP,1),dischargeP:fmt(dischargeP,1),unit},...p]);
    setShowLog(true);
  }

  return(<>
    {/* Air entering */}
    <div className="card">
      <div className="section-label">Luftside Inn — Return Air</div>
      <div className="two-col">
        <div className="field">
          <div className="lbl"><span><Tip id="db" label="Dry-Bulb"/> <span className="db">DB</span></span><span className="utag">°{unit}</span></div>
          <input type="number" min={tempMin} max={tempMax} step={0.01} value={enterDB} onChange={e=>setEnterDB(parseFloat(e.target.value)||0)}/>
          <input type="range" min={tempMin} max={tempMax} step={0.1} value={enterDB} onChange={e=>setEnterDB(parseFloat(parseFloat(e.target.value).toFixed(2)))}/>
        </div>
        <div className="field">
          <div className="lbl"><span><Tip id="rh" label="Relative Humidity"/>span className="utag">%</span></div>
          <input type="number" min={5} max={100} step={0.1} value={enterRH} onChange={e=>setEnterRH(parseFloat(e.target.value)||0)}/>
          <input type="range" min={5} max={100} step={0.1} value={enterRH} onChange={e=>setEnterRH(parseFloat(parseFloat(e.target.value).toFixed(1)))}/>
        </div>
      </div>
      <div className="info-row">
        <span><span className="ik">WB<sub>inn</sub></span><span className="iv">{disp(wb_enter,2)}°{unit}</span></span>
        <span><span className="ik">h<sub>inn</sub></span><span className="iv">{fmt(h_enter)}</span><span className="iu"> kJ/kg</span></span>
        <span><span className="ik">v</span><span className="iv">{fmt(v_enter,4)}</span><span className="iu"> m³/kg</span></span>
        <span><span className="ik">W</span><span className="iv">{fmt(W_enter*1000,2)}</span><span className="iu"> g/kg</span></span>
      </div>
    </div>
    {/* Air leaving */}
    <div className="card" style={{borderColor:'rgba(56,189,248,0.18)'}}>
      <div className="section-label" style={{color:'#38bdf8'}}>Luftside Ut — Supply Air</div>
      <div className="two-col">
        <div className="field">
          <div className="lbl"><span><Tip id="db" label="Leaving DB"/> <span className="db">DB</span></span><span className="utag">°{unit} — målt</span></div>
          <input type="number" min={tempMin} max={tempMax} step={0.01} value={leaveDB} onChange={e=>setLeaveDB(parseFloat(e.target.value)||0)} style={{borderColor:'rgba(56,189,248,0.4)'}}/>
          <input type="range" min={tempMin} max={tempMax} step={0.1} value={leaveDB} onChange={e=>setLeaveDB(parseFloat(parseFloat(e.target.value).toFixed(2)))}/>
        </div>
        <div className="field">
          <div className="lbl"><span><Tip id="rh" label="Leaving RH"/>/span><span className="utag">% — målt</span></div>
          <input type="number" min={5} max={100} step={0.1} value={leaveRHinput} onChange={e=>setLeaveRHinput(parseFloat(e.target.value)||0)} style={{borderColor:'rgba(56,189,248,0.4)'}}/>
          <input type="range" min={5} max={100} step={0.1} value={leaveRHinput} onChange={e=>setLeaveRHinput(parseFloat(parseFloat(e.target.value).toFixed(1)))}/>
        </div>
      </div>
      <div className="info-row" style={{marginTop:10}}>
        <span><span className="ik">WB<sub>ut</sub></span><span className="iv">{disp(wb_leave,2)}°{unit}</span><span className="calc-tag">calc</span></span>
        <span><span className="ik">h<sub>ut</sub></span><span className="iv">{fmt(h_leave)}</span><span className="iu"> kJ/kg</span></span>
        <span><span className="ik">v<sub>ut</sub></span><span className="iv" style={{color:'#fbbf24'}}>{fmt(v_leave,4)}</span><span className="iu"> m³/kg</span></span>
        <span><span className="ik">W<sub>ut</sub></span><span className="iv">{fmt(W_leave*1000,2)}</span><span className="iu"> g/kg</span></span>
      </div>
    </div>
    {/* Water side */}
    <div className="card" style={{borderColor:'rgba(14,165,233,0.25)'}}>
      <div className="section-label" style={{color:'#0ea5e9'}}>Væskeside — Chilled Water</div>
      <div className="three-col">
        <div className="field">
          <div className="lbl"><span><Tip id="watertin" label="Water Inlet T"/>/span><span className="utag">°{unit}</span></div>
          <input type="number" min={-20} max={50} step={0.01} value={waterTin} onChange={e=>setWaterTin(parseFloat(e.target.value)||0)} style={{borderColor:'rgba(14,165,233,0.4)'}}/>
        </div>
        <div className="field">
          <div className="lbl"><span><Tip id="watertout" label="Water Outlet T"/>/span><span className="utag">°{unit}</span></div>
          <input type="number" min={-20} max={50} step={0.01} value={waterTout} onChange={e=>setWaterTout(parseFloat(e.target.value)||0)} style={{borderColor:'rgba(14,165,233,0.4)'}}/>
        </div>
        <div className="field">
          <div className="lbl"><span><Tip id="waterflow" label="Water Flow"/>/span><span className="utag">L/s</span></div>
          <input type="number" min={0.01} max={100} step={0.001} value={waterFlowLs} onChange={e=>setWaterFlowLs(parseFloat(e.target.value)||0)} style={{borderColor:'rgba(14,165,233,0.4)'}}/>
        </div>
      </div>
      <div className="info-row" style={{borderColor:'rgba(14,165,233,0.25)',background:'rgba(14,165,233,0.05)'}}>
        <span><span className="ik">ΔT vann</span><span className="iv" style={{color:'#0ea5e9'}}>{fmt(Math.abs(waterToutC-waterTinC),2)}</span><span className="iu"> K</span></span>
        <span><span className="ik">ṁ vann</span><span className="iv" style={{color:'#0ea5e9'}}>{fmt(massFlowWater,3)}</span><span className="iu"> kg/s</span></span>
        <span><span className="ik">Q water</span><span className="iv" style={{color:'#0ea5e9'}}>{fmt(qWaterKW,2)}</span><span className="iu"> kW</span></span>
        <span><span className="ik">Flow</span><span className="iv" style={{color:'#0ea5e9'}}>{fmt(waterFlowLs*3.6,2)}</span><span className="iu"> m³/h</span></span>
      </div>
    </div>
    {/* Airflow + power */}
    <div className="card">
      <div className="section-label">Airflow & Electrical Input</div>
      <div className="two-col">
        <div className="field">
          <div className="lbl"><span><Tip id="airflow" label="Airflow"/>/span><span className="utag">m³/h</span></div>
          <input type="number" min={10} max={50000} step={10} value={airflowM3h} onChange={e=>setAirflowM3h(parseFloat(e.target.value)||0)}/>

        </div>
        <div className="field">
          <div className="lbl"><span><Tip id="pel" label="Power Input"/> Pₐ</span><span className="utag">kW</span></div>
          <input type="number" min={0.1} max={500} step={0.05} value={powerKW} onChange={e=>setPowerKW(parseFloat(e.target.value)||0)}/>
        </div>
      </div>
    </div>
    {/* Refrigerant */}
    <RefrigerantSection unit={unit} refrig={refrig} setRefrig={setRefrig} suctionP={suctionP} setSuctionP={setSuctionP} dischargeP={dischargeP} setDischargeP={setDischargeP} suctionTemp={suctionTemp} setSuctionTemp={setSuctionTemp}/>
    {/* Results */}
    <div className="results">
      <div className="rl2">Calculated Output</div>
      <div className="rgrid">
        <div className="ri big"><div className="rn">Q<sub>air</sub> — Air Side Cooling</div><div className="rv">{fmt(qAirKW,2)} kW</div><div className="ru">{fmt(qAirKW*3412.14,0)} BTU/h</div></div>
        <div className={`ri ${Math.abs(balance)>10?'warn-card':'ok-card'}`}>
          <div className="rn">Q<sub>water</sub> — Water Side</div>
          <div className="rv" style={{fontSize:22,color:Math.abs(balance)>10?'#f87171':'#22c55e'}}>{fmt(qWaterKW,2)} kW</div>
          <div className="ru">{Math.abs(balance)>10?`⚠ ${fmt(Math.abs(balance),1)}% avvik`:`✓ ${fmt(Math.abs(balance),1)}% avvik`}</div>
        </div>
        <div className="ri"><div className="rn"><Tip id="eer" label="EER / COP"/>/div><div className="rv" style={{color:eerColor(eer)}}>{fmt(eer,2)}</div><div className="ru">Q<sub>luft</sub> ÷ P<sub>el</sub></div></div>
        <div className="ri"><div className="rn">ṁ<sub>luft</sub></div><div className="rv">{fmt(massFlowAir,3)}</div><div className="ru">kg/s</div></div>
        <div className="ri"><div className="rn">Δh luft</div><div className="rv">{fmt(dh,2)}</div><div className="ru">kJ/kg</div></div>
        <div className="ri"><div className="rn">ΔT vann</div><div className="rv">{fmt(Math.abs(waterToutC-waterTinC),2)}</div><div className="ru">K</div></div>
      </div>
      <div className="formula">
        <strong>Q<sub>luft</sub></strong> = ṁ<sub>luft</sub> · (h<sub>inn</sub> − h<sub>ut</sub>) = {fmt(massFlowAir,4)} × {fmt(dh,2)} = <strong>{fmt(qAirKW,2)} kW</strong><br/>
        <strong>Q<sub>vann</sub></strong> = ṁ<sub>vann</sub> · c<sub>p</sub> · ΔT = {fmt(massFlowWater,3)} × {CP_WATER} × {fmt(Math.abs(waterToutC-waterTinC),2)} = <strong>{fmt(qWaterKW,2)} kW</strong><br/>
        <strong>EER</strong> = {fmt(qAirKW,2)} ÷ {fmt(powerKW,2)} = <strong>{fmt(eer,2)}</strong>
      </div>
    </div>
    <div className="btn-row no-print">
      <button className="btn btn-success" onClick={save}>💾 Lagre måling</button>
      <button className="btn btn-primary" onClick={()=>window.print()}>🖨 Print / PDF</button>
    </div>
  </>);
}

// ── Liquid/Liquid Calculator ──────────────────────────────────────────────
function LiquidLiquidCalc({unit,jobName,unitId,log,setLog,setShowLog}){
  const [fluidType,setFluidType]=useState("water"); // water or glycol
  const [glycolPct,setGlycolPct]=useState(30);
  const [coldTin,setColdTin]=useState(7);const [coldTout,setColdTout]=useState(12);
  const [coldFlowLs,setColdFlowLs]=useState(0.5);
  const [hotTin,setHotTin]=useState(40);const [hotTout,setHotTout]=useState(35);
  const [hotFlowLs,setHotFlowLs]=useState(0.6);
  const [hotFluidType,setHotFluidType]=useState("water");
  const [hotGlycolPct,setHotGlycolPct]=useState(30);
  const [powerKW,setPowerKW]=useState(1.2);
  const [refrig,setRefrig]=useState("R32");const [suctionP,setSuctionP]=useState(8.0);
  const [dischargeP,setDischargeP]=useState(28.0);const [suctionTemp,setSuctionTemp]=useState(15.0);

  const toC=v=>unit==="F"?(v-32)*5/9:v;
  const fromC=v=>unit==="F"?v*9/5+32:v;
  const coldTinC=toC(coldTin),coldToutC=toC(coldTout),hotTinC=toC(hotTin),hotToutC=toC(hotTout);
  const cpCold=fluidType==="glycol"?cpGlycol(glycolPct):CP_WATER;
  const rhoCold=fluidType==="glycol"?rhoGlycol(glycolPct):1.0;
  const cpHot=hotFluidType==="glycol"?cpGlycol(hotGlycolPct):CP_WATER;
  const rhoHot=hotFluidType==="glycol"?rhoGlycol(hotGlycolPct):1.0;
  const mCold=coldFlowLs*rhoCold,mHot=hotFlowLs*rhoHot;
  const qCold=mCold*cpCold*Math.abs(coldToutC-coldTinC);
  const qHot=mHot*cpHot*Math.abs(hotTinC-hotToutC);
  const eer=powerKW>0?qCold/powerKW:0;
  const balance=qCold>0?((qHot-qCold)/qCold)*100:0;
  const eColor=eerColor(eer);

  function save(){
    const tEvap=refrig!=="Other"?satTempFromPressure(refrig,suctionP):null;
    const sC=unit==="F"?toC(suctionTemp):suctionTemp;
    const sh=tEvap!=null?sC-tEvap:null;
    const tCond=refrig!=="Other"?satTempFromPressure(refrig,dischargeP):null;
    setLog(p=>[{id:Date.now(),date:new Date().toLocaleString(),mode:'Liquid/Liquid',job:jobName||"—",unitId:unitId||"—",refrig,
      t_inn:fmt(fromC(coldTinC),2),t_ut:fmt(fromC(coldToutC),2),wb_inn:"—",wb_ut:"—",
      rh_inn:"—",rh_ut:"—",h_inn:"—",h_ut:"—",
      w_tin:fmt(fromC(hotTinC),2),w_tout:fmt(fromC(hotToutC),2),w_flow:fmt(hotFlowLs,3),
      airflow:"—",powerKW:fmt(powerKW,2),cooling:fmt(qCold,2),qWater:fmt(qHot,2),eer:fmt(eer,2),
      tEvap:tEvap!=null?fmt(tEvap,1):"—",superheat:sh!=null?fmt(sh,1):"—",tCond:tCond!=null?fmt(tCond,1):"—",
      suctionP:fmt(suctionP,1),dischargeP:fmt(dischargeP,1),unit},...p]);
    setShowLog(true);
  }

  return(<>
    {/* Cold side */}
    <div className="card" style={{borderColor:'rgba(56,189,248,0.25)'}}>
      <div className="section-label" style={{color:'#38bdf8'}}>Kaldside — Chilled Water / Glykol</div>
      <div className="field">
        <div className="lbl"><span>Væsketype</span></div>
        <select value={fluidType} onChange={e=>setFluidType(e.target.value)}>
          <option value="water">Vann</option>
          <option value="glycol">Etylenglykol / Vann</option>
        </select>
      </div>
      {fluidType==="glycol"&&(
        <div className="field">
          <div className="lbl"><span><Tip id="glycol" label="Glycol Concentration"/>/span><span className="utag">%</span></div>
          <input type="number" min={0} max={60} step={1} value={glycolPct} onChange={e=>setGlycolPct(parseFloat(e.target.value)||0)}/>
          <div style={{fontSize:11,color:'#475569',marginTop:6}}>c<sub>p</sub> = {fmt(cpCold,3)} kJ/kg·K · ρ ≈ {fmt(rhoCold,3)} kg/L</div>
        </div>
      )}
      <div className="three-col">
        <div className="field">
          <div className="lbl"><span><Tip id="watertin" label="T Inlet"/>/span><span className="utag">°{unit}</span></div>
          <input type="number" min={-30} max={50} step={0.01} value={coldTin} onChange={e=>setColdTin(parseFloat(e.target.value)||0)} style={{borderColor:'rgba(56,189,248,0.4)'}}/>
        </div>
        <div className="field">
          <div className="lbl"><span><Tip id="watertout" label="T Outlet"/>/span><span className="utag">°{unit}</span></div>
          <input type="number" min={-30} max={50} step={0.01} value={coldTout} onChange={e=>setColdTout(parseFloat(e.target.value)||0)} style={{borderColor:'rgba(56,189,248,0.4)'}}/>
        </div>
        <div className="field">
          <div className="lbl"><span>Flow</span><span className="utag">L/s</span></div>
          <input type="number" min={0.01} max={100} step={0.001} value={coldFlowLs} onChange={e=>setColdFlowLs(parseFloat(e.target.value)||0)} style={{borderColor:'rgba(56,189,248,0.4)'}}/>
        </div>
      </div>
      <div className="info-row" style={{borderColor:'rgba(56,189,248,0.25)',background:'rgba(56,189,248,0.05)'}}>
        <span><span className="ik">ΔT</span><span className="iv" style={{color:'#38bdf8'}}>{fmt(Math.abs(coldToutC-coldTinC),2)}</span><span className="iu"> K</span></span>
        <span><span className="ik">ṁ</span><span className="iv" style={{color:'#38bdf8'}}>{fmt(mCold,3)}</span><span className="iu"> kg/s</span></span>
        <span><span className="ik">Q kald</span><span className="iv" style={{color:'#38bdf8'}}>{fmt(qCold,2)}</span><span className="iu"> kW</span></span>
        <span><span className="ik">c<sub>p</sub></span><span className="iv" style={{color:'#38bdf8'}}>{fmt(cpCold,3)}</span><span className="iu"> kJ/kg·K</span></span>
      </div>
    </div>
    {/* Hot side */}
    <div className="card" style={{borderColor:'rgba(251,191,36,0.25)'}}>
      <div className="section-label" style={{color:'#fbbf24'}}>Varmside — Kondensatorvann / Glykol</div>
      <div className="field">
        <div className="lbl"><span>Væsketype</span></div>
        <select value={hotFluidType} onChange={e=>setHotFluidType(e.target.value)}>
          <option value="water">Vann</option>
          <option value="glycol">Etylenglykol / Vann</option>
        </select>
      </div>
      {hotFluidType==="glycol"&&(
        <div className="field">
          <div className="lbl"><span><Tip id="glycol" label="Glycol Concentration"/>/span><span className="utag">%</span></div>
          <input type="number" min={0} max={60} step={1} value={hotGlycolPct} onChange={e=>setHotGlycolPct(parseFloat(e.target.value)||0)}/>
          <div style={{fontSize:11,color:'#475569',marginTop:6}}>c<sub>p</sub> = {fmt(cpHot,3)} kJ/kg·K · ρ ≈ {fmt(rhoHot,3)} kg/L</div>
        </div>
      )}
      <div className="three-col">
        <div className="field">
          <div className="lbl"><span><Tip id="watertin" label="T Inlet"/>/span><span className="utag">°{unit}</span></div>
          <input type="number" min={-30} max={80} step={0.01} value={hotTin} onChange={e=>setHotTin(parseFloat(e.target.value)||0)} style={{borderColor:'rgba(251,191,36,0.4)'}}/>
        </div>
        <div className="field">
          <div className="lbl"><span><Tip id="watertout" label="T Outlet"/>/span><span className="utag">°{unit}</span></div>
          <input type="number" min={-30} max={80} step={0.01} value={hotTout} onChange={e=>setHotTout(parseFloat(e.target.value)||0)} style={{borderColor:'rgba(251,191,36,0.4)'}}/>
        </div>
        <div className="field">
          <div className="lbl"><span>Flow</span><span className="utag">L/s</span></div>
          <input type="number" min={0.01} max={100} step={0.001} value={hotFlowLs} onChange={e=>setHotFlowLs(parseFloat(e.target.value)||0)} style={{borderColor:'rgba(251,191,36,0.4)'}}/>
        </div>
      </div>
      <div className="info-row" style={{borderColor:'rgba(251,191,36,0.25)',background:'rgba(251,191,36,0.05)'}}>
        <span><span className="ik">ΔT</span><span className="iv" style={{color:'#fbbf24'}}>{fmt(Math.abs(hotTinC-hotToutC),2)}</span><span className="iu"> K</span></span>
        <span><span className="ik">ṁ</span><span className="iv" style={{color:'#fbbf24'}}>{fmt(mHot,3)}</span><span className="iu"> kg/s</span></span>
        <span><span className="ik">Q varm</span><span className="iv" style={{color:'#fbbf24'}}>{fmt(qHot,2)}</span><span className="iu"> kW</span></span>
        <span><span className="ik">c<sub>p</sub></span><span className="iv" style={{color:'#fbbf24'}}>{fmt(cpHot,3)}</span><span className="iu"> kJ/kg·K</span></span>
      </div>
    </div>
    {/* Power */}
    <div className="card">
      <div className="section-label">Electrical Input</div>
      <div className="field">
        <div className="lbl"><span><Tip id="pel" label="Compressor Power"/> Pₐ</span><span className="utag">kW</span></div>
        <input type="number" min={0.1} max={500} step={0.05} value={powerKW} onChange={e=>setPowerKW(parseFloat(e.target.value)||0)}/>
      </div>
      <div style={{marginTop:14}}>
        <div className="bar-lbls"><span>COP: <strong style={{color:eColor}}>{fmt(eer,2)} — {eerLabel(eer)}</strong></span></div>
        <div className="bar-track"><div className="bar-fill" style={{width:`${Math.min(100,(eer/6)*100)}%`,background:eColor}}/></div>
      </div>
    </div>
    {/* Refrigerant */}
    <RefrigerantSection unit={unit} refrig={refrig} setRefrig={setRefrig} suctionP={suctionP} setSuctionP={setSuctionP} dischargeP={dischargeP} setDischargeP={setDischargeP} suctionTemp={suctionTemp} setSuctionTemp={setSuctionTemp}/>
    {/* Results */}
    <div className="results">
      <div className="rl2">Calculated Output</div>
      <div className="rgrid">
        <div className="ri big"><div className="rn">Q<sub>cold</sub> — Cooling Output</div><div className="rv">{fmt(qCold,2)} kW</div><div className="ru">{fmt(qCold*3412.14,0)} BTU/h · {fmt(qCold/3.517,2)} tons</div></div>
        <div className={`ri ${Math.abs(balance)>10?'warn-card':'ok-card'}`}>
          <div className="rn">Q<sub>hot</sub> — Condenser</div>
          <div className="rv" style={{fontSize:22,color:Math.abs(balance)>10?'#f87171':'#22c55e'}}>{fmt(qHot,2)} kW</div>
          <div className="ru">{Math.abs(balance)>10?`⚠ ${fmt(Math.abs(balance),1)}% avvik`:`✓ ${fmt(Math.abs(balance),1)}% avvik`}</div>
        </div>
        <div className="ri"><div className="rn"><Tip id="eer" label="COP / EER"/>/div><div className="rv" style={{color:eColor}}>{fmt(eer,2)}</div><div className="ru">Q<sub>kald</sub> ÷ P<sub>el</sub></div></div>
        <div className="ri"><div className="rn">P<sub>el</sub></div><div className="rv">{fmt(powerKW,2)}</div><div className="ru">kW input</div></div>
        <div className="ri"><div className="rn">ΔT kald</div><div className="rv">{fmt(Math.abs(coldToutC-coldTinC),2)}</div><div className="ru">K</div></div>
        <div className="ri"><div className="rn">ΔT varm</div><div className="rv">{fmt(Math.abs(hotTinC-hotToutC),2)}</div><div className="ru">K</div></div>
      </div>
      <div className="formula">
        <strong>Q<sub>kald</sub></strong> = ṁ · c<sub>p</sub> · ΔT = {fmt(mCold,3)} × {fmt(cpCold,3)} × {fmt(Math.abs(coldToutC-coldTinC),2)} = <strong>{fmt(qCold,2)} kW</strong><br/>
        <strong>Q<sub>varm</sub></strong> = {fmt(mHot,3)} × {fmt(cpHot,3)} × {fmt(Math.abs(hotTinC-hotToutC),2)} = <strong>{fmt(qHot,2)} kW</strong><br/>
        <strong>COP</strong> = {fmt(qCold,2)} ÷ {fmt(powerKW,2)} = <strong>{fmt(eer,2)}</strong>
      </div>
    </div>
    <div className="btn-row no-print">
      <button className="btn btn-success" onClick={save}>💾 Lagre måling</button>
      <button className="btn btn-primary" onClick={()=>window.print()}>🖨 Print / PDF</button>
    </div>
  </>);
}

// ── Main App ──────────────────────────────────────────────────────────────
function App(){
  const [mode,setMode]=useState("air-air");
  const [unit,setUnit]=useState("C");
  const [jobName,setJobName]=useState("");
  const [unitId,setUnitId]=useState("");
  const [log,setLog]=useState(()=>{try{return JSON.parse(localStorage.getItem('noditech_log')||'[]')}catch{return[]}});
  const [showLog,setShowLog]=useState(false);
  useEffect(()=>{localStorage.setItem('noditech_log',JSON.stringify(log))},[log]);

  function switchUnit(u){
    if(u===unit)return;
    setUnit(u);
  }

  function deleteEntry(id){setLog(p=>p.filter(e=>e.id!==id))}
  function clearLog(){if(window.confirm("Slette alle lagrede målinger?"))setLog([])}
  function exportCSV(){
    if(!log.length)return;
    const headers=["Dato","Modus","Jobb","Enhet","Kjølemiddel","T inn","T ut","WB inn","WB ut","RH inn","RH ut","h inn","h ut","Airflow m³/h","Effekt kW","Q kW","Q vann/varm kW","EER/COP","T evap °C","Superheat K","T cond °C","P suction bar","P discharge bar","Enhet"];
    const rows=log.map(e=>[e.date,e.mode,e.job,e.unitId,e.refrig,e.t_inn,e.t_ut,e.wb_inn,e.wb_ut,e.rh_inn,e.rh_ut,e.h_inn,e.h_ut,e.airflow,e.powerKW,e.cooling,e.qWater||"—",e.eer,e.tEvap,e.superheat,e.tCond,e.suctionP,e.dischargeP,e.unit]);
    const csv=[headers,...rows].map(r=>r.map(c=>`"${c}"`).join(",")).join("\n");
    const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);a.download="noditech_målinger.csv";a.click();
  }

  const modeLabel={
    "air-air":"Air / Air",
    "air-liquid":"Air / Liquid",
    "liquid-liquid":"Liquid / Liquid"
  }[mode];

  return(
    <div className="app">
      <div className="container">
        {/* Print header */}
        <div className="print-header">
          <div style={{fontFamily:'Syne,sans-serif',fontSize:28,fontWeight:800,color:'#000',marginBottom:4}}>Noditech AB — {modeLabel} Cooling Report</div>
          <div style={{fontSize:12,color:'#555'}}>
            {jobName&&<span>Jobb: <strong>{jobName}</strong> · </span>}
            {unitId&&<span>Enhet: <strong>{unitId}</strong> · </span>}
            {new Date().toLocaleString()}
          </div>
        </div>
        {/* Header */}
        <div className="header no-print">
          <div style={{fontFamily:'Syne,sans-serif',fontSize:'clamp(36px,8vw,72px)',fontWeight:800,color:'#f0f9ff',letterSpacing:'-0.03em',lineHeight:1,marginBottom:6}}>
            Nodi<span style={{color:'#38bdf8'}}>tech</span> <span style={{color:'#38bdf8'}}>AB</span>
          </div>
          <h1 style={{fontSize:'clamp(18px,3vw,26px)',fontWeight:700,color:'#94a3b8',marginBottom:4}}>
            Cooling <span>&amp; EER</span> Calculator
          </h1>
          <p style={{fontSize:11,color:'#475569',letterSpacing:'0.08em',marginBottom:16}}>by Simen Olsen Allum</p>

          {/* Mode selector */}
          <div className="mode-selector">
            {[
              {id:"air-air",icon:"💨",label:"Air / Air",sub:"Luft til luft"},
              {id:"air-liquid",icon:"🌊",label:"Air / Liquid",sub:"Luft til vann"},
              {id:"liquid-liquid",icon:"🔄",label:"Liquid / Liquid",sub:"Vann til vann"},
            ].map(m=>(
              <button key={m.id} className={`mode-btn ${mode===m.id?'active':''}`} onClick={()=>setMode(m.id)}>
                <span className="mode-icon">{m.icon}</span>
                <span className="mode-label">{m.label}</span>
                <span className="mode-sub">{m.sub}</span>
              </button>
            ))}
          </div>
        </div>

        {/* Job info */}
        <div className="card no-print">
          <div className="section-label">Måleinfo</div>
          <div className="two-col">
            <div className="field"><div className="lbl"><span>Jobb / Sted</span></div><input type="text" placeholder="f.eks. Kontor 3. etg" value={jobName} onChange={e=>setJobName(e.target.value)}/></div>
            <div className="field"><div className="lbl"><span>Enhet ID / Serienr.</span></div><input type="text" placeholder="f.eks. AHU-01" value={unitId} onChange={e=>setUnitId(e.target.value)}/></div>
          </div>
        </div>

        {/* Unit toggle */}
        <div className="card no-print">
          <div className="section-label">Temperaturenhet</div>
          <div style={{display:'flex',gap:8}}>
            {["C","F"].map(u=>(
              <button key={u} onClick={()=>switchUnit(u)} style={{flex:1,padding:'10px',borderRadius:8,border:'1px solid',borderColor:unit===u?'#38bdf8':'rgba(255,255,255,0.1)',background:unit===u?'rgba(56,189,248,0.12)':'rgba(255,255,255,0.03)',color:unit===u?'#38bdf8':'#64748b',fontFamily:'DM Mono,monospace',fontSize:14,transition:'all .2s'}}>°{u}</button>
            ))}
          </div>
        </div>

        {/* Calculator */}
        {mode==="air-air"&&<AirAirCalc unit={unit} jobName={jobName} unitId={unitId} log={log} setLog={setLog} setShowLog={setShowLog}/>}
        {mode==="air-liquid"&&<AirLiquidCalc unit={unit} jobName={jobName} unitId={unitId} log={log} setLog={setLog} setShowLog={setShowLog}/>}
        {mode==="liquid-liquid"&&<LiquidLiquidCalc unit={unit} jobName={jobName} unitId={unitId} log={log} setLog={setLog} setShowLog={setShowLog}/>}

        {/* Log toggle */}
        <div className="btn-row no-print" style={{marginTop:8}}>
          <button className="btn btn-amber" onClick={()=>setShowLog(v=>!v)}>{showLog?'Skjul':'Vis'} logg ({log.length})</button>
        </div>

        {/* Log */}
        {showLog&&(
          <div className="card no-print" style={{marginTop:14}}>
            <div className="section-label">Målelogg</div>
            {log.length===0?(
              <div style={{fontSize:13,color:'#475569',padding:'12px 0'}}>Ingen målinger lagret ennå.</div>
            ):(
              <>
                <div style={{overflowX:'auto'}}>
                  <table className="log-table">
                    <thead><tr><th>Dato</th><th>Modus</th><th>Jobb</th><th>Enhet</th><th>Ref.</th><th>T inn</th><th>T ut</th><th>Q kW</th><th>EER</th><th>SH K</th><th>T evap</th><th></th></tr></thead>
                    <tbody>
                      {log.map(e=>(
                        <tr key={e.id}>
                          <td style={{fontSize:10,color:'#64748b',whiteSpace:'nowrap'}}>{e.date}</td>
                          <td style={{fontSize:10}}>{e.mode}</td>
                          <td style={{color:'#f0f9ff'}}>{e.job}</td>
                          <td>{e.unitId}</td>
                          <td><span style={{color:REF_COLORS[e.refrig]||'#94a3b8',fontWeight:600}}>{e.refrig}</span></td>
                          <td>{e.t_inn}°</td>
                          <td style={{color:'#38bdf8'}}>{e.t_ut}°</td>
                          <td style={{color:'#38bdf8',fontWeight:600}}>{e.cooling}</td>
                          <td style={{color:eerColor(parseFloat(e.eer)),fontWeight:600}}>{e.eer}</td>
                          <td>{e.superheat}</td>
                          <td>{e.tEvap}°</td>
                          <td><button className="btn-danger" onClick={()=>deleteEntry(e.id)}>✕</button></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                <div className="btn-row" style={{marginTop:12}}>
                  <button className="btn btn-primary" onClick={exportCSV}>⬇ Eksporter CSV</button>
                  <button className="btn btn-danger" style={{padding:'8px 14px',fontSize:12}} onClick={clearLog}>Slett alle</button>
                </div>
              </>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
